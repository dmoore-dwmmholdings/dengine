    "lib/zstd.h",
    "lib/zstd_errors.h",
    "lib/common/**",
    "lib/compress/**",
    "lib/decompress/**",
    # Dictionary builder (ZDICT_trainFromBuffer) for the .dpak writer's per-type dictionaries.
