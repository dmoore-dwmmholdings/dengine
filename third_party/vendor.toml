# Pin list of every vendored library (SPEC §22, CONVENTIONS §6, policy in third_party/README.md).
# Managed by tools/vendor/vendor.py:
#
#   python3 tools/vendor/vendor.py fetch <name> | --all     (re)write third_party/<name>/
#   python3 tools/vendor/vendor.py verify                   tree == pinned archive, for every lib
#
# One [[lib]] table per library. To add a library, append a table, run `vendor.py hash <url>` for
# the sha256, then `vendor.py fetch <name>`. To take more files from a library already here,
# extend its `files` list; never add a second entry for the same library.
#
# Keys:
#   name          directory under third_party/ and the CMake target suffix (de_tp_<name>)
#   version       upstream version (tag, or `<date>-<short sha>` for an untagged commit)
#   url           release tarball, or a git archive at a tag or commit (never a branch)
#   sha256        sha256 of the archive at `url`
#   license       SPDX expression; must be in the SPEC §22 allowlist in vendor.py
#   license_file  licence file inside the archive (after `strip`); copied to <name>/LICENSE
#                 (default "LICENSE")
#   strip         leading path components removed from archive paths (default 1)
#   files         globs of archive paths to vendor (`*` within a component, `**` across them);
#                 upstream `.gitignore` and `.gitattributes` files are never vendored (DENG-362)
#   exclude       globs removed again from `files` (default [])
#   local         globs of engine-owned files in third_party/<name>/ that the tool never touches
#                 (default ["CMakeLists.txt", "de_*", "smoke/**", "patches/**"])
#   patches       local patch files applied in order with `git apply` (prefer none) (default [])
#   kind          "source" (default): every selected file is committed. "prebuilt": the keys
#                 above are the committed part (headers, LICENSE), and per-host binary archives
#                 are pinned in [lib.hosts.<host>] tables. Those archives are never committed:
#                 vendor.py keeps them in its cache, and cmake/DePrebuilt.cmake extracts the
#                 target host's files into the build directory at configure time (DENG-390)
#
# A prebuilt entry adds one table per host, right after its [[lib]] keys:
#
#   [lib.hosts.<host>]  host = macos-arm64 | linux-x64 | windows-x64
#   url                 the host's release archive
#   sha256              sha256 of that archive
#   files               globs of archive paths to extract (symlinks need their target too)
#   exclude             globs removed again from `files` (default [])
#   strip               leading path components removed (default 1)
#
# The committed part usually points at one of the host archives (the headers are the same in
# each); with the same url and sha256 both share one cached file.

[[lib]]
name = "xxhash"
version = "0.8.4"
url = "https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.4.tar.gz"
sha256 = "5738270935e7c3d38a79b3adf7c9692566ce7895a25f67de43ad52ab504acd32"
license = "BSD-2-Clause"
files = ["xxhash.h"]
# UBSan fix in XXH_vld1q_u64() (misaligned NEON load, AArch64 GCC); see the patch header. DENG-358.
patches = ["patches/0001-neon-unaligned-load-memcpy.patch"]

[[lib]]
name = "zstd"
version = "1.5.7"
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
# zstd is dual-licensed BSD-3-Clause (LICENSE) or GPL-2.0 (COPYING); we take BSD-3-Clause.
license = "BSD-3-Clause"
files = [
    "lib/zstd.h",
    "lib/zstd_errors.h",
    "lib/common/**",
    "lib/compress/**",
    "lib/decompress/**",
    # Dictionary builder (ZDICT_trainFromBuffer) for the .dpak writer's per-type dictionaries.
    # Built only into the tools-only target de_tp_zstd_dict, never into the runtime. DENG-211.
    "lib/dictBuilder/**",
    "lib/zdict.h",
]
# x86-64 Huffman assembly: the build sets ZSTD_DISABLE_ASM so the C path is used everywhere.
exclude = ["lib/decompress/*.S"]

