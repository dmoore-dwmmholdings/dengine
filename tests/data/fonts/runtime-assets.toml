[project]
asset_root = "."
version = 1
[defaults.font]
em_px = 8
px_range = 1
page_size = 256
charset = "ascii"
[assets]
"font/latin" = {type="font", source="latin/NotoSans.ttf"}
"font/tt-msdf" = {type="font", source="latin/NotoSans.ttf", mode="msdf", em_px=48, px_range=6}
