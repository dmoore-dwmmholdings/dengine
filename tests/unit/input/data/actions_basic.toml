# Action maps of a small game (DENG-84): loaded by test_action_toml.c with de_action_maps_load.

[maps.gameplay.actions.move]
type = "axis2d"
rebindable = true
bindings = [
    { key = "W", composite = "up" },
    { key = "S", composite = "down" },
    { key = "A", composite = "left" },
    { key = "D", composite = "right" },
    { pad_axis = "left_stick", deadzone = 0.2 },
]

[maps.gameplay.actions.look]
type = "axis2d"
bindings = [
    { mouse_delta = "xy", scale = 0.1 },
    { pad_axis = "right_stick", deadzone = 0.15, curve = "power", exponent = 2.0, invert = true },
    { gyro = "xy" },
]

[maps.gameplay.actions.jump]
interaction = "press"
rebindable = true
bindings = [{ key = "space" }, { pad_button = "south" }]

[maps.gameplay.actions.super_jump]
bindings = [{ key = "space", modifier = "lshift" }]

[maps.gameplay.actions.interact]
interaction = "hold"
hold_seconds = 0.4
bindings = [{ key = "e" }, { pad_button = "west" }]

[maps.gameplay.actions.dodge]
interaction = "double_tap"
double_tap_seconds = 0.25
bindings = [{ key = "lctrl" }]

[maps.gameplay.actions.throttle]
type = "axis1d"
press_threshold = 0.1
bindings = [
    { pad_axis = "right_trigger", curve = "custom", points = [[0.0, 0.0], [0.5, 0.2], [1.0, 1.0]] },
    { key = "up", composite = "positive" },
    { key = "down", composite = "negative" },
]

[maps.gameplay.actions.fire]
interaction = "tap"
tap_seconds = 0.15
bindings = [{ mouse_button = "left" }, { pad_axis = "right_trigger" }]

[maps.menu.actions.confirm]
bindings = [{ key = "return" }, { pad_button = "south" }]

[maps.menu.actions.scroll]
type = "axis1d"
bindings = [{ mouse_wheel = "y" }, { pad_button = "dpad_up", composite = "positive" },
            { pad_button = "dpad_down", composite = "negative" }]
