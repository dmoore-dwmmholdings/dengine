# tests/golden/scenes.toml: the golden scenes and how each is judged (DENG-329). One table per
# scene, [scene.<name>], for every DE_GOLDEN_SCENE; de-golden refuses a scene without its table and
# a table without its scene. CMake reads the table names: each scene gets the CTest
# golden.<backend>.<scene> on every backend this build has. docs/testing/golden.md has the details.
#
#   threshold_mean  the largest mean LDR-FLIP error that passes (required)
#   threshold_p99   the largest 99th-percentile error that passes (required)
#   backends        default ["metal", "vulkan", "d3d12"]
#   tiers           default ["base"]; "rt" renders and compares at the RT tier (refs/<b>/rt/)
#   requires        caps the device must have, else SKIPPED: mesh_shaders, ray_query,
#                   rt_pipelines, hardware_rt, async_compute
#   size            default 512 (square), or [width, height]
#   format          "rgba8" (default) or "rgba16f" (read back tone-mapped)
#   reference       use another scene's reference images (default: the scene's own)
#   expect_fail     the harness self test: passes only when the comparison fails
#
# Thresholds: the references are per backend, so a run on the machine that made them is exact
# (FLIP 0). The thresholds allow for other devices and drivers of the same backend: interpolation,
# filtering and rasterization differ by a code value or so, which LDR-FLIP rates at about 0.02 on
# flat color. A color off by 8/255 on flat color rates about 0.14 and fails every scene below.

[scene.rhi_clear]
description = "RGBA16F target cleared to (0.25, 0.5, 4.0, 1); the readback is tone-mapped"
format = "rgba16f"
threshold_mean = 0.005
threshold_p99 = 0.02

# DENG-180: fixed S19 cooked clip poses, through the actual player and GPU skinning.
# Metal is the native S19 qualification; other backend references remain unqualified.
[scene.anim_cesium_pose_pair]
description = "Cooked CesiumMan at 0 and 0.4 seconds through animation, extraction and GPU skinning"
size = [512, 256]
backends = ["metal"]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.anim_cesium_frozen_selftest]
description = "Frozen second pose must differ from the legacy-player pose-pair reference"
reference = "anim_cesium_pose_pair"
expect_fail = true
size = [512, 256]
backends = ["metal"]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.rhi_triangle]
description = "four triangles: interpolated colors, reverse-Z depth test, back-face culling"
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.rhi_textured_quad]
description = "rotated quad sampling a 32x32 texture through bindless indices, linear, repeat"
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.rhi_compute_gradient]
description = "compute shader writes the image into a buffer, copied into the target"
threshold_mean = 0.005
threshold_p99 = 0.02

[scene.rhi_indirect_count]
description = "compute writes 4 indexed draw records and the count 3: three triangles appear"
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.rhi_mesh_triangle]
description = "amplification + mesh shader hexagon fan with vertex colors"
requires = ["mesh_shaders"]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.rhi_selftest_perturbed]
description = "self test: rhi_triangle with every vertex color off by 8/255 must fail"
reference = "rhi_triangle"
expect_fail = true
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.views_split_screen]
description = "renderer views: split screen (right half at render_scale 0.5), a picture-in-picture view, and a render-to-texture view sampled by the left view in the same frame (DENG-176)"
size = [1280, 720]
threshold_mean = 0.005
threshold_p99 = 0.05

# DENG-240: the S13 visibility buffer (tests/golden/visbuffer/). Each scene runs the vis frame for
# several frames and checks in C, with the 0.01 % edge-tie budget, that culling on == culling off
# (and on Metal the mesh path == the compute path); the picture is the decoded vis IDs as flat
# colours (or the G-buffer panels). The thresholds are the rhi_* ones: a picture that moves by a
# pixel at an edge stays far below them, a wrong instance or a missing meshlet does not.
[scene.vis_cull_frustum]
description = "instances around and behind a camera turning a full circle in 6 frames; culling on == off on every frame (DENG-240)"
size = [320, 192]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.vis_cull_occlusion_path]
description = "city blocks, a scripted 30-frame camera walk down a street; two-phase occlusion on == culling off on every frame (DENG-240)"
size = [320, 192]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.vis_cull_small]
description = "1600 sub-pixel spheres 60 to 220 m away; the small-meshlet test removes meshlets, on == off (DENG-240)"
size = [320, 192]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.vis_paths_equal]
description = "mixed meshes: single- and double-sided, mirrored, alpha-tested cutouts; compute path on == off, and mesh path == compute path on Metal (DENG-240)"
size = [320, 192]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.vis_gbuffer_debug_views]
description = "the thin G-buffer of the material resolve: normal, base colour and motion panels, one box moving (DENG-240)"
size = [576, 160]
threshold_mean = 0.005
threshold_p99 = 0.05

[scene.vis_stats_sanity]
description = "a wall with props in front and behind it: per-frame instance stats in range; phase 2 draws all on the first frame and none once the history holds the wall (DENG-240)"
size = [320, 192]
threshold_mean = 0.005
threshold_p99 = 0.05

# DENG-307: the materials gallery (tests/golden/materials/; one of the three Milestone 1 reference
# scenes, reused by S20 DENG-278: keep the names). Each scene runs the renderer and the asset system
# over materials/assets/ until the image settles (fixed EV100, output.basic, no temporal effect).
# Thresholds per scene, from the observed Metal (M5 Pro) vs lavapipe spread with about 1.5x
# margin (Metal vs WARP is smaller). A backend reproduces its own reference exactly, also under
# Metal shader validation (the CTests) since DENG-430 fixed the resolve's flicker there. A layer
# that renders wrong is a bug of its owning task (a follow-up issue, e.g. DENG-429), never a
# reason to loosen these.
[scene.materials_gallery_ibl]
description = "materials gallery, every layer (metallic x roughness, IOR, specular, emissive, clearcoat, sheen, anisotropy, iridescence, transmission, volume, diffuse transmission, subsurface, Unlit, alpha mask, alpha blend) lit by a sky environment (DENG-307)"
size = [512, 224]
threshold_mean = 0.008  # Metal vs lavapipe: mean 0.0055, p99 0.027
threshold_p99 = 0.04

[scene.materials_gallery_lights]
description = "materials gallery lit by a sun, a point, a spot, a rect and a disk light in physical units at EV100 0, no environment (DENG-307)"
size = [512, 224]
threshold_mean = 0.007  # Metal vs lavapipe: mean 0.0044, p99 0.022
threshold_p99 = 0.035

[scene.materials_furnace]
description = "white dielectric and metal spheres in a uniform environment: every sphere interior within 2 % of the environment radiance x exposure, checked in C (DENG-307)"
size = [256, 192]
threshold_mean = 0.001  # Metal vs lavapipe and WARP: mean 0.000003, p99 0
threshold_p99 = 0.01

[scene.materials_khr_samples]
description = "procedural stand-ins for the Khronos ClearCoatTest, SheenChair, IridescenceLamp, TransmissionTest and AnisotropyBarnLamp sample models (DENG-307)"
size = [448, 256]
threshold_mean = 0.006  # Metal vs lavapipe: mean 0.0037, p99 0.027
threshold_p99 = 0.04

[scene.materials_layers_furnace]
description = "coat1, sheen1 and combined white spheres: actual renderer energy within unchanged 2 % furnace limit (DENG-431)"
size = [256, 192]
threshold_mean = 0.001
threshold_p99 = 0.01

