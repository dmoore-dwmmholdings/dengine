# Determinism: the per-tick world checksums of every tests/determinism/ scenario must be the same
# on Linux x86-64, Windows x86-64 and macOS arm64 (SPEC §19.4, §5.7, risk R6; DENG-353).
#
# Each determinism-run job builds the scenario executables (target de_determinism_tests) in a
# Release preset with that platform's main compiler, runs `ctest -L determinism` (worker counts,
# the checked-in golden files, rollback, the harness self tests) and uploads the
# <scenario>.checksums files the tests wrote to build/<preset>/determinism/. determinism-diff then
# compares the three platforms' files byte for byte and names the first differing tick.
# docs/ci.md describes the jobs; physics (DENG-136) and later modules add scenarios, not jobs.
name: Determinism

on:
  push:
    branches: [main, dev, "sprint/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determinism-run:
    name: determinism ${{ matrix.platform }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            os: ubuntu-24.04
            preset: linux-gcc-release
            compiler: gcc
          - platform: windows-x86-64
            os: windows-2022
            preset: windows-msvc-release
            compiler: msvc
          - platform: macos-arm64
            os: macos-14
            preset: macos-release
            compiler: apple-clang
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: determinism-${{ matrix.preset }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cat "build/${PRESET}/de_config_dump.txt"

      - name: Build the scenarios
        shell: bash
        run: cmake --build --preset "${PRESET}" --target de_determinism_tests

      - name: ctest -L determinism
        shell: bash
        run: ctest --preset "${PRESET}" -L determinism --output-on-failure

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/determinism/*.checksums
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-logs-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  determinism-diff:
    name: determinism diff (3 platforms)
    needs: determinism-run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: determinism-*
          path: checksums

      - name: Compare platforms
        shell: bash
        run: |
          set -u
          ref=linux-x86-64
          platforms="linux-x86-64 windows-x86-64 macos-arm64"
          status=0
          for p in ${platforms}; do
            if [ ! -d "checksums/determinism-${p}" ]; then
              echo "::error::no checksums from ${p} (its determinism-run job failed early)"
              status=1
            fi
          done
          [ -d "checksums/determinism-${ref}" ] || exit 1
          {
            echo "## Determinism: per-tick checksums"
            echo
            echo "| Scenario | Ticks | windows-x86-64 vs ${ref} | macos-arm64 vs ${ref} |"
            echo "|---|---|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          for f in "checksums/determinism-${ref}"/*.checksums; do
            name=$(basename "${f}")
            ticks=$(grep -vc '^#' "${f}")
            row="| ${name%.checksums} | ${ticks} |"
            for p in windows-x86-64 macos-arm64; do
              g="checksums/determinism-${p}/${name}"
              if [ ! -f "${g}" ]; then
                echo "::error::${name}: missing from ${p}"
                row="${row} missing |"
                status=1
              elif cmp -s "${f}" "${g}"; then
                echo "${name}: ${p} equals ${ref}"
                row="${row} equal |"
              else
                # Line 1 is the header, so line n holds tick n - 2.
                first=$(diff "${f}" "${g}" | grep -m1 -oE '^[0-9]+' || true)
                tick=$(( ${first:-2} - 2 ))
                echo "::error::${name}: ${p} diverges from ${ref} at tick ${tick}"
                diff "${f}" "${g}" | head -n 20 || true
                row="${row} **diverges at tick ${tick}** |"
                status=1
              fi
            done
            echo "${row}" >> "${GITHUB_STEP_SUMMARY}"
          done
          exit "${status}"
