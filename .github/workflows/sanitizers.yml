# Sanitizers (SPEC §19.3): every test under ASan+UBSan and TSan on Linux Clang, ASan+UBSan on
# macOS, and TSan on Linux GCC. The presets (ci-*) set DE_SANITIZE; their test presets set
# ASAN_/UBSAN_/TSAN_OPTIONS, so `ctest --preset ci-linux-asan` behaves the same locally
# (docs/ci.md).
#
# Two tiers, as in ci.yml: a run on a feature/** branch is quick (the two Linux Clang jobs), every
# other run is full; `gh workflow run Sanitizers -f tier=full` forces the full set.
#
# The full tier also runs fuzz-smoke (SPEC §19.1; DENG-216): every libFuzzer target fuzzes for 60 s
# under ASan+UBSan, starting from its checked-in corpus plus the corpus that earlier runs grew
# (actions/cache, DENG-395). The sanitize jobs only replay the checked-in corpora.
name: Sanitizers

on:
  push:
    branches: [main, dev, "sprint/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "auto (quick on feature/**, full elsewhere), quick or full"
        type: choice
        options: [auto, quick, full]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to dev or main never cancels the running run: merges land faster than a full run
  # takes, so cancelling left dev with no finished result. The group keeps at most one queued
  # run (the newest) behind the running one. Other refs cancel as before.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    if: github.ref != 'refs/heads/diagnostics/DENG-546-gcc-refill-profile'
    name: plan (${{ inputs.tier || 'auto' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tier: ${{ steps.plan.outputs.tier }}
    steps:
      - id: plan
        shell: bash
        env:
          TIER: ${{ inputs.tier || 'auto' }}
          REF: ${{ github.ref }}
        run: |
          if [ "${TIER}" = auto ]; then
            case "${REF}" in refs/heads/feature/*) TIER=quick ;; *) TIER=full ;; esac
          fi
          # One job per line; quick: true marks the quick tier. Workers run ci-macos-asan on the
          # host before they push, so the quick tier keeps the two Linux Clang jobs.
          # macOS ASan+UBSan: Apple Clang ASan alone missed UB in vendored code (DENG-356).
          # GCC TSan: GCC rejects some atomics under TSan (-Wtsan, an error with -Werror), which
          # Clang accepts; this job keeps platform/de_atomic.h building with GCC TSan (DENG-357).
          jobs=$(cat <<'EOF'
          { "name": "linux clang ASan+UBSan", "os": "ubuntu-24.04", "compiler": "clang", "preset": "ci-linux-asan", "flag": "-fsanitize=address,undefined", "quick": true }
          { "name": "linux clang TSan", "os": "ubuntu-24.04", "compiler": "clang", "preset": "ci-linux-tsan", "flag": "-fsanitize=thread", "quick": true }
          { "name": "macos apple-clang ASan+UBSan", "os": "macos-14", "compiler": "apple-clang", "preset": "ci-macos-asan", "flag": "-fsanitize=address,undefined" }
          { "name": "linux gcc TSan", "os": "ubuntu-24.04", "compiler": "gcc", "preset": "ci-linux-gcc-tsan", "flag": "-fsanitize=thread" }
          EOF
          )
          if [ "${TIER}" = quick ]; then
            matrix=$(jq -cs '{include: [.[] | select(.quick)]}' <<<"${jobs}")
          else
            matrix=$(jq -cs '{include: .}' <<<"${jobs}")
          fi
          echo "tier: ${TIER}"
          jq . <<<"${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "tier=${TIER}" >> "${GITHUB_OUTPUT}"

  sanitize:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRESET: ${{ matrix.preset }}
      # The same values as the ci-* test presets; set here too so they show in the job log.
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          sanitizers: "true"

      # Ubuntu 24.04 runners use 32 bits of mmap randomness, which the TSan (and older ASan)
      # runtimes cannot map around ("unexpected memory mapping"). 28 bits is the old default.
      - name: Reduce ASLR entropy for the sanitizer runtimes
        if: runner.os == 'Linux'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cat "build/${PRESET}/de_config_dump.txt"

      - name: Check that the sanitizer flags are on
        shell: bash
        env:
          FLAG: ${{ matrix.flag }}
        run: |
          # A sanitizer job that silently builds without -fsanitize would pass every test.
          if ! grep -F -m 1 -o -e "${FLAG}" "build/${PRESET}/compile_commands.json"; then
            echo "::error::${FLAG} is missing from build/${PRESET}/compile_commands.json"
            exit 1
          fi

      - name: Build
        shell: bash
        run: cmake --build --preset "${PRESET}"

      - name: Test
        shell: bash
        env:
          DE_AUDIO_STREAM_TRACE: "1"
        run: ctest --preset "${PRESET}" --output-on-failure --parallel 4

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/de_config_dump.txt
          if-no-files-found: ignore
          retention-days: 7

  audio-gcc-profile:
    name: DENG-546 GCC TSan CPU profile (diagnostic)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostics/DENG-546-gcc-refill-profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TSAN_OPTIONS: halt_on_error=1
      DE_AUDIO_STREAM_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: gcc
          cache-key: ci-linux-gcc-tsan
          cache-save: "false"
          sanitizers: "true"
      - name: Prepare existing sanitizer environment and CPU sampling
        shell: bash
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-generic
          python3 - <<'PY'
          import os
          from pathlib import Path
          tools = sorted(Path("/usr/lib/linux-tools").glob("*/perf"))
          if not tools:
              raise SystemExit("No perf executable installed; no profile is inferred")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PERF_TOOL={tools[-1]}\n")
          PY
      - name: Configure and verify exact failing production source and instrumentation
        shell: bash
        run: |
          git fetch --depth=1 origin 16f8dea1b5c557e8989efe90a267badcf67c139a
          git diff --exit-code 16f8dea1 -- src include tests third_party cmake CMakePresets.json
          cmake --preset ci-linux-gcc-tsan
          {
            git rev-parse HEAD
            gcc --version
            uname -a
            "${PERF_TOOL}" --version
            cat build/ci-linux-gcc-tsan/de_config_dump.txt
          } > audio-gcc-profile-metadata.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("build/ci-linux-gcc-tsan/compile_commands.json").read_text())
          names = ("/source_opus.c", "/source_vorbis.c", "/source/stream.c")
          selected = [row for row in rows if row["file"].endswith(names)]
          assert len(selected) == 3, selected
          for row in selected:
              assert "-fsanitize=thread" in row["command"], row
              assert "-fno-omit-frame-pointer" in row["command"], row
          Path("audio-gcc-profile-compile.json").write_text(json.dumps(selected, indent=2))
          PY
      - name: Build original streaming test
        shell: bash
        run: cmake --build --preset ci-linux-gcc-tsan --target test_audio_streaming
      - name: Sample CPU during all original streaming cases
        id: profile
        shell: bash
        run: |
          # Frame-pointer call chains contain addresses, not raw stack memory.
          # Profiling overhead makes this diagnostic, never release qualification.
          ctest_path="$(command -v ctest)"
          sudo "${PERF_TOOL}" record --quiet -F 199 -e cpu-clock:u --call-graph fp \
            -o "${RUNNER_TEMP}/audio-gcc-tsan.perf" -- \
            env TSAN_OPTIONS=halt_on_error=1 DE_AUDIO_STREAM_TRACE=1 \
            "${ctest_path}" --test-dir build/ci-linux-gcc-tsan --parallel 4 \
            --no-tests=error -V -R '^audio_streaming\.' \
            --output-junit "${GITHUB_WORKSPACE}/audio-gcc-profile.xml" \
            2>&1 | tee audio-gcc-profile-test.log
      - name: Render CPU profile
        if: ${{ !cancelled() && (steps.profile.outcome == 'success' || steps.profile.outcome == 'failure') }}
        shell: bash
        run: |
          sudo "${PERF_TOOL}" report -i "${RUNNER_TEMP}/audio-gcc-tsan.perf" --stdio \
            --no-children --sort comm,dso,symbol --percent-limit 0.25 \
            -g graph,0.5,caller | tee audio-gcc-profile-report.txt >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("audio-gcc-profile.xml").getroot().iter("testcase"))
          assert len(cases) == 19, len(cases)
          assert all(c.find("skipped") is None for c in cases)
          print("All 19 original cases executed; diagnostic failures remain failures")
          PY
      - name: Upload diagnostic evidence (no raw stack or perf dump)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-gcc-tsan-cpu-profile
          path: |
            audio-gcc-profile-metadata.txt
            audio-gcc-profile-compile.json
            audio-gcc-profile-test.log
            audio-gcc-profile-report.txt
            audio-gcc-profile.xml
          if-no-files-found: warn
          retention-days: 7

  # DENG-216: libFuzzer smoke run, full tier only. Linux Clang Debug with ASan+UBSan (the
  # ci-linux-asan preset) and DE_FUZZ_LIBFUZZER=ON; -fsanitize=fuzzer-no-link instruments every
  # library too, so the fuzzer gets coverage from the parsers and not only from the fuzz target's
  # own file. Each fuzz target (CTest label `fuzz`, the harness self test excluded: its crash input
  # is reachable on purpose) runs for FUZZ_SECONDS from its checked-in corpus and its cached corpus
  # fuzz-corpus/<test name>/, where libFuzzer writes the new inputs. A crash, leak, timeout (10 s
  # per input) or allocation over 256 MiB fails the job; the inputs that caused it are uploaded as
  # `fuzz-findings`. Reproduce locally: docs/ci.md.
  #
  # DENG-395: fuzz-corpus/ is kept between runs with actions/cache, so coverage grows from run to
  # run. A cache entry cannot be overwritten, so each run saves under a new key (run id and
  # attempt) and the next run restores the newest entry by prefix: first this ref's, then any it
  # may read (GitHub scopes caches to the branch, its pull request base and the default branch).
  # After fuzzing, `-merge=1` keeps only the inputs that add coverage, so the cache stays small.
  # Pull request runs restore but do not save. The checked-in seed corpora never change here.
  fuzz-smoke:
    name: linux clang libFuzzer smoke (ASan+UBSan)
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRESET: ci-linux-asan
      FUZZ_SECONDS: "60"
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: ci-linux-fuzz
          cache-save: ${{ github.event_name != 'pull_request' }}
          sanitizers: "true"

      - name: Reduce ASLR entropy for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${PRESET}" -DDE_FUZZ_LIBFUZZER=ON \
            -DCMAKE_C_FLAGS=-fsanitize=fuzzer-no-link -DCMAKE_CXX_FLAGS=-fsanitize=fuzzer-no-link
          # Without libFuzzer the targets would only replay their corpora and the job would pass.
          if ! grep -q '^DE_FUZZ_USES_LIBFUZZER:INTERNAL=ON$' "build/${PRESET}/CMakeCache.txt"; then
            echo "::error::the fuzz targets were not built with libFuzzer"
            exit 1
          fi

      - name: List the fuzz targets
        id: targets
        shell: bash
        run: |
          # The CTest entry fuzz.<name> runs the target fuzz_<name>. (CTest reports the command
          # only once the executable exists, so the next steps read it after the build.)
          targets=$(ctest --preset "${PRESET}" -N -L fuzz -LE selftest --show-only=json-v1 \
            | jq -r '[.tests[].name | sub("^fuzz[.]"; "fuzz_")] | join(" ")')
          echo "targets: ${targets}"
          if [ -z "${targets}" ]; then
            echo "::error::no fuzz targets found"
            exit 1
          fi
          echo "build=${targets}" >> "${GITHUB_OUTPUT}"

      - name: Build the fuzz targets
        shell: bash
        env:
          TARGETS: ${{ steps.targets.outputs.build }}
        run: |
          read -r -a targets <<<"${TARGETS}"
          cmake --build --preset "${PRESET}" --target "${targets[@]}"

      - name: Restore the fuzz corpora
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
            fuzz-corpus-

      - name: Fuzz each target for ${{ env.FUZZ_SECONDS }} s
        id: fuzz
        shell: bash
        env:
          CACHE_HIT: ${{ steps.corpus.outputs.cache-matched-key }}
        run: |
          set -u
          # fuzz.<name> runs `fuzz_<name> -runs=0 [<corpus dir>] [-dict=<file>]`: take the path,
          # the corpus and the dictionary (DENG-106).
          ctest --preset "${PRESET}" -N -L fuzz -LE selftest --show-only=json-v1 \
            | jq -c '[.tests[] | {name: .name, exe: .command[0],
                       corpus: ([(.command // [])[1:][] | select(startswith("-") | not)] | first // ""),
                       dict: ([(.command // [])[1:][] | select(startswith("-dict="))] | first // "")}]' \
            > fuzz-targets.json
          if jq -e 'any(.[]; .exe == null)' fuzz-targets.json >/dev/null; then
            echo "::error::a fuzz target was not built"
            jq . fuzz-targets.json
            exit 1
          fi
          mkdir -p fuzz-findings fuzz-work fuzz-corpus
          # Drop the cached corpora of targets that no longer exist.
          for d in fuzz-corpus/*/; do
            [ -d "${d}" ] || continue
            d=$(basename "${d}")
            if ! jq -e --arg n "${d}" 'any(.[]; .name == $n)' fuzz-targets.json >/dev/null; then
              echo "dropping the cached corpus of ${d}"
              rm -rf "fuzz-corpus/${d}"
            fi
          done
          status=0
          {
            echo "## libFuzzer smoke: ${FUZZ_SECONDS} s per target"
            echo
            echo "Cached corpus: ${CACHE_HIT:-none (first run on this ref)}"
            echo
            echo "| Target | Result | Runs | Cached corpus: restored, after fuzzing, after merge |"
            echo "|---|---|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          count() { find "$1" -type f | wc -l | tr -d ' '; }
          while read -r t; do
            name=$(jq -r .name <<<"${t}")
            exe=$(jq -r .exe <<<"${t}")
            corpus=$(jq -r .corpus <<<"${t}")
            dict=$(jq -r .dict <<<"${t}")
            # libFuzzer writes new inputs to the first directory: the cached corpus.
            work="fuzz-corpus/${name}"
            mkdir -p "${work}"
            restored=$(count "${work}")
            echo "::group::${name}"
            args=(-max_total_time="${FUZZ_SECONDS}" -timeout=10 -rss_limit_mb=2048
                  -malloc_limit_mb=256 -print_final_stats=1
                  -artifact_prefix="fuzz-findings/${name}-" "${work}")
            if [ -n "${dict}" ]; then
              args+=("${dict}")
            fi
            if [ -n "${corpus}" ]; then
              args+=("${corpus}")
            fi
            set +e
            "${exe}" "${args[@]}" 2>&1 | tee "fuzz-work/${name}.log"
            rc=${PIPESTATUS[0]}
            set -e
            fuzzed=$(count "${work}")
            merged="-"
            if [ "${rc}" -eq 0 ] && [ "${fuzzed}" -gt 0 ]; then
              # Keep the inputs of the cached corpus that add coverage. A failed merge keeps the
              # corpus as it is; it is not a finding.
              min="fuzz-work/${name}.merged"
              rm -rf "${min}"
              mkdir -p "${min}"
              if "${exe}" -merge=1 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=256 \
                   "${min}" "${work}" > "fuzz-work/${name}.merge.log" 2>&1; then
                rm -rf "${work}"
                mv "${min}" "${work}"
                merged=$(count "${work}")
              else
                echo "::warning::${name}: corpus merge failed, the corpus is kept unmerged"
                tail -n 20 "fuzz-work/${name}.merge.log"
              fi
            fi
            echo "::endgroup::"
            runs=$(grep -m1 -oE 'stat::number_of_executed_units: *[0-9]+' "fuzz-work/${name}.log" \
                   | grep -oE '[0-9]+$' || echo "?")
            files="${restored}, ${fuzzed}, ${merged}"
            if [ "${rc}" -eq 0 ]; then
              echo "| ${name} | ok | ${runs} | ${files} |" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::error::${name}: libFuzzer exit code ${rc} (inputs in the fuzz-findings artifact)"
              echo "| ${name} | **failed (exit ${rc})** | ${runs} | ${files} |" \
                >> "${GITHUB_STEP_SUMMARY}"
              status=1
            fi
          done < <(jq -c '.[]' fuzz-targets.json)
          exit "${status}"

      # Also after a finding: the crash input is in fuzz-findings/, not in the corpus, and the
      # other targets' corpora are still worth keeping.
      - name: Save the fuzz corpora
        if: >-
          !cancelled() && github.event_name != 'pull_request' &&
          (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            fuzz-findings/
            fuzz-work/*.log
          if-no-files-found: ignore
          retention-days: 14
