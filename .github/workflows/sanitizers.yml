# Sanitizers (SPEC §19.3): every test under ASan+UBSan and TSan on Linux Clang, and ASan on
# macOS. The presets (ci-*) set DE_SANITIZE; their test presets set ASAN_/UBSAN_/TSAN_OPTIONS,
# so `ctest --preset ci-linux-asan` behaves the same locally (docs/ci.md).
name: Sanitizers

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitize:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux clang ASan+UBSan, os: ubuntu-24.04, compiler: clang, preset: ci-linux-asan, flag: "-fsanitize=address,undefined" }
          - { name: linux clang TSan, os: ubuntu-24.04, compiler: clang, preset: ci-linux-tsan, flag: "-fsanitize=thread" }
          - { name: macos apple-clang ASan, os: macos-14, compiler: apple-clang, preset: ci-macos-asan, flag: "-fsanitize=address" }
    env:
      PRESET: ${{ matrix.preset }}
      # The same values as the ci-* test presets; set here too so they show in the job log.
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          sanitizers: "true"

      # Ubuntu 24.04 runners use 32 bits of mmap randomness, which the TSan (and older ASan)
      # runtimes cannot map around ("unexpected memory mapping"). 28 bits is the old default.
      - name: Reduce ASLR entropy for the sanitizer runtimes
        if: runner.os == 'Linux'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cat "build/${PRESET}/de_config_dump.txt"

      - name: Check that the sanitizer flags are on
        shell: bash
        env:
          FLAG: ${{ matrix.flag }}
        run: |
          # A sanitizer job that silently builds without -fsanitize would pass every test.
          if ! grep -F -m 1 -o -e "${FLAG}" "build/${PRESET}/compile_commands.json"; then
            echo "::error::${FLAG} is missing from build/${PRESET}/compile_commands.json"
            exit 1
          fi

      - name: Build
        shell: bash
        run: cmake --build --preset "${PRESET}"

      - name: Test
        shell: bash
        run: ctest --preset "${PRESET}" --output-on-failure --parallel 4

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/de_config_dump.txt
          if-no-files-found: ignore
          retention-days: 7
