# Repository checks (SPEC §19.3): the public-header compile check and the layering check (the
# CTest label `check`), the vendored trees and every host's prebuilt archive against their pins,
# and clang-format on the C and Objective-C files a change touches. Local equivalents are in docs/ci.md.
name: Checks

on:
  push:
    branches: [main, dev, "sprint/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to dev or main never cancels the running run: merges land faster than a full run
  # takes, so cancelling left dev with no finished result. The group keeps at most one queued
  # run (the newest) behind the running one. Other refs cancel as before.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ctest-checks:
    name: header + layering checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRESET: linux-clang-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: checks-${{ env.PRESET }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Configure
        run: cmake --preset "${PRESET}"

      # header_check (C11 + C++17 compile of every public header), layering_check
      # (tools/check_layers/check_layers.py), layering_selftest, vendor_selftest and
      # deterministic_asm_check (builds the deterministic targets, then disassembles them).
      - name: ctest -L check
        run: ctest --preset "${PRESET}" -L check --output-on-failure

      - name: Upload the module graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layers-dot
          path: build/${{ env.PRESET }}/tools/check_layers/layers.dot
          if-no-files-found: ignore
          retention-days: 7

  vendor:
    name: vendor.py verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # vendor.py keeps the pinned archives in ~/.cache/dengine-vendor (DE_VENDOR_CACHE unset), so
      # a warm cache means verify does not download anything. This job holds every host's
      # prebuilt archive; the build jobs cache only their own host's (vendor-host-<os>-*, set up
      # by setup-dengine), so the key prefixes differ.
      - name: Cache vendor archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dengine-vendor
          key: vendor-all-${{ hashFiles('third_party/vendor.toml') }}
          restore-keys: vendor-all-

      # --all-hosts: a `kind = "prebuilt"` entry's archive is checked for every host (url and
      # sha256), not only for this Linux runner's (DENG-390).
      - name: Verify vendored trees
        run: python tools/vendor/vendor.py verify --all-hosts

  format:
    name: clang-format (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned so CI and developers format the same way: pip install clang-format==<this>.
      CLANG_FORMAT_VERSION: "22.1.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install clang-format
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version

      - name: Check formatting of changed C files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The commit to compare against: the PR base, the previous tip of the pushed branch,
          # or (new branch, force push, manual run) the merge base with the default branch.
          base=""
          if [ "${EVENT}" = "pull_request" ]; then
            base="${PR_BASE}"
          elif [ -n "${PUSH_BEFORE}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
               && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${PUSH_BEFORE}"
          fi
          if [ -z "${base}" ]; then
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "::warning::no base commit found; checking every C file"
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "Comparing against ${base}"
          # Vendored code is byte-exact upstream and is never reformatted. Objective-C (.m, .mm)
          # uses the ObjC section of .clang-format (DENG-408).
          git diff --name-only --diff-filter=ACMR -z "${base}" HEAD -- \
              '*.c' '*.h' '*.cpp' '*.hpp' '*.inl' '*.m' '*.mm' ':!third_party/**' \
            > "${RUNNER_TEMP}/changed.txt"
          if [ ! -s "${RUNNER_TEMP}/changed.txt" ]; then
            echo "No changed C files."
            exit 0
          fi
          tr '\0' '\n' < "${RUNNER_TEMP}/changed.txt"
          xargs -0 clang-format --dry-run --Werror < "${RUNNER_TEMP}/changed.txt"
