# CI-only DENG-610/611 qualification; do not merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng610-text-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: DENG-610 text ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-clang-cl-debug
          - config: Release
            preset: windows-clang-cl-release
          - config: Shipping
            preset: windows-clang-cl-shipping
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact published product and test inputs
        run: |
          source=6e52b95642491963336f20b6df58e0bc54ad306a
          git fetch --no-tags --depth=1 origin "$source"
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD "$source" > source-identity.txt
          git ls-tree "$source" tests/golden tests/unit/text src/text >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure unchanged preset
        run: cmake --preset "$PRESET"
      - name: Build original font, packed-asset and golden tests
        id: build
        run: cmake --build --preset "$PRESET" --target test_text_import test_golden_assets de_golden --parallel 4
      - name: Run full affected family with original references and limits
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,sys,xml.etree.ElementTree as E,json,re
          root=(pathlib.Path('build')/os.environ['PRESET']).resolve();out=root/'deng610';out.mkdir(parents=True,exist_ok=True)
          families={'cpu': ['text_import.font.numeric_nested_ranges_match_legacy_string_ranges', 'text_import.font.numeric_ranges_reject_invalid_pairs', 'text_import.font.charset_expansion', 'text_import.font.system_lifetime', 'text_import.font.latin_metrics_and_determinism', 'text_import.font.msdf_a_iou_4em', 'text_import.font.cff_outlines_and_ranges', 'text_import.font.cjk_msdf_strokes_and_background_at_ui_and_large_sizes', 'text_import.font.cff_msdf_strokes_counters_and_background_at_small_and_large_sizes', 'text_import.font.truetype_msdf_strokes_counters_and_background_at_small_and_large_sizes', 'golden_assets.packed_fonts_and_cleanup', 'golden_assets.failed_cook_cleans_mount', 'golden_assets.source_mode_unchanged'], 'goldens': ['golden.d3d12.text_msdf_scales', 'golden.d3d12.text_outline_shadow', 'golden.d3d12.text_bitmap_pixel', 'golden.d3d12.text_world_text', 'golden.d3d12.ui_rect_border', 'golden.d3d12.ui_nine_slice', 'golden.d3d12.ui_clip_nested', 'golden.d3d12.ui_z_popup', 'golden.d3d12.ui_text_labels', 'golden.d3d12.ui_widgets_basic', 'golden.d3d12.ui_widgets_advanced_text', 'golden.d3d12.ui_widgets_advanced_controls', 'golden.d3d12.ui_world_1m', 'golden.d3d12.ui_world_20m', 'golden.d3d12.ui_world_occluded', 'golden.d3d12.ui_world_overlay', 'golden.d3d12.ui_world_lit', 'golden.d3d12.ui_world_origin_100km', 'golden.d3d12.ui_pixel_four']}
          summary={};failed=False
          for family,names in families.items():
              report=out/(family+'.xml');log=out/(family+'.log')
              pattern=r'^(?:'+'|'.join(map(re.escape,names))+r')$'
              cmd=['ctest','--test-dir',str(root),'-R',pattern,'--parallel','1','--no-tests=error','--output-on-failure','--test-output-size-passed','1048576','--test-output-size-failed','1048576','--output-junit',str(report)]
              with log.open('w') as stream:r=subprocess.run(cmd,stdout=stream,stderr=subprocess.STDOUT)
              cases=list(E.parse(report).iter('testcase'));errors=[]
              if len(cases)!=len(names) or {c.get('name') for c in cases}!=set(names):errors.append('missing, duplicated or unexpected cases')
              for c in cases:
                  name=c.get('name');text=c.findtext('system-out','')
                  if c.find('skipped') is not None or c.get('status')=='notrun':errors.append(name+': skipped/notrun')
                  if c.find('failure') is not None or c.find('error') is not None:errors.append(name+': failed')
                  if family=='goldens' and 'd3d12: enhanced barriers' not in text:errors.append(name+': actual enhanced mode unobserved')
              summary[family]={'exit':r.returncode,'count':len(cases),'errors':errors};failed |= bool(r.returncode or errors)
              print(log.read_text(),flush=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2));sys.exit(int(failed))
          PY
      - name: Retain reports, original output images and identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng610-text-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng610/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
