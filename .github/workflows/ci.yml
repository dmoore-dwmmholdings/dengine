# CI-only validation branch. Product/test sources must exactly match the reviewed candidate.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng644-vulkan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  atlas:
    name: DENG-644 native Vulkan atlas (source-identical checkpoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify candidate source identity
        run: |
          git diff --exit-code 62b48a24283d24527d044ec1081604af9a57db6d HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > source-identity.txt
          git rev-parse 62b48a24283d24527d044ec1081604af9a57db6d:src HEAD:src >> source-identity.txt
          git rev-parse 62b48a24283d24527d044ec1081604af9a57db6d:tests HEAD:tests >> source-identity.txt
          git rev-parse 62b48a24283d24527d044ec1081604af9a57db6d:shaders HEAD:shaders >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: linux-clang-debug
          cache-save: "false"
      - name: Install existing Vulkan CI runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers libasound2-dev libpipewire-0.3-dev libspa-0.2-dev
          deng644_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "$deng644_icd"
          echo "VK_DRIVER_FILES=$deng644_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$deng644_icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$deng644_icd" VK_ICD_FILENAMES="$deng644_icd" vulkaninfo --summary
      - name: Configure unchanged Debug preset
        run: cmake --preset linux-clang-debug
      - name: Build affected executable
        id: build
        run: cmake --build --preset linux-clang-debug --target test_render_shadow_atlas --parallel 4
      - name: Run all existing Vulkan atlas cases
        run: ctest --test-dir build/linux-clang-debug -V --parallel 1 --no-tests=error -R '^render_shadow_atlas\..*_vulkan$' > build/linux-clang-debug/atlas-ctest.log 2>&1
      - name: Require actual native admission capture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DE_SHADOW_EVIDENCE_DIR: build/linux-clang-debug/deng644-native
        run: |
          mkdir -p build/linux-clang-debug/deng644-native
          build/linux-clang-debug/tests/unit/render/test_render_shadow_atlas --filter=shadow_atlas.atlas_receiver_admission_vulkan > build/linux-clang-debug/deng644-native/native.log 2>&1
          cat build/linux-clang-debug/deng644-native/native.log
      - name: Preserve raw qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng644-native-vulkan
          path: |
            source-identity.txt
            build/linux-clang-debug/deng644-native/
            build/linux-clang-debug/atlas-ctest.log
            build/linux-clang-debug/Testing/Temporary/LastTest.log
            build/linux-clang-debug/de_config_dump.txt
          if-no-files-found: error
