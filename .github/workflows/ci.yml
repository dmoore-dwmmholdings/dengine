# CI-only DENG-618 qualification wrapper; never merge this workflow override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng618-numeric-${{ github.ref }}
  cancel-in-progress: false
jobs:
  numeric:
    name: DENG-618 ${{ matrix.kind }} ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: candidate
            config: Debug
            preset: windows-clang-cl-debug
          - kind: candidate
            config: Release
            preset: windows-clang-cl-release
          - kind: baseline
            config: Debug
            preset: windows-clang-cl-debug
    env:
      PRESET: ${{ matrix.preset }}
      DENG618_KIND: ${{ matrix.kind }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify matched runtime and fixture sources
        run: |
          candidate=77cdc8b15a0bfc1e7368e5687e0c6c6e05bfa09d
          baseline=6cb88bf435eea0f7eb4df20220a349cc7c5b56d1
          git fetch --no-tags --depth=1 origin "$candidate" "$baseline"
          git diff --exit-code "$candidate" HEAD -- . ':(exclude).github/workflows/ci.yml'
          runtime="$candidate"
          if [ "$DENG618_KIND" = baseline ]; then
            runtime="$baseline"
            git restore --source="$baseline" -- src/gpu/d3d12/d3d12_barriers.c src/gpu/d3d12/d3d12_internal.h tests/unit/gpu/d3d12/test_d3d12_barrier_tables.c
          fi
          git diff --exit-code "$runtime" -- src include shaders cmake third_party CMakeLists.txt CMakePresets.json
          git diff --exit-code "$candidate" -- tests ':(exclude)tests/unit/gpu/d3d12/test_d3d12_barrier_tables.c'
          git diff --exit-code "$runtime" -- tests/unit/gpu/d3d12/test_d3d12_barrier_tables.c
          git rev-parse HEAD > source-identity.txt
          echo "$runtime" >> source-identity.txt
          git diff --stat "$candidate" -- src tests >> source-identity.txt
          sha256sum src/gpu/d3d12/d3d12_barriers.c src/gpu/d3d12/d3d12_internal.h tests/unit/gpu/d3d12/test_d3d12_pipeline.c tests/unit/gpu/data/pipelines/uav_rt_init.slang >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure unchanged preset
        run: cmake --preset "$PRESET"
      - name: Build numeric and original golden executables
        id: build
        run: cmake --build --preset "$PRESET" --target test_gpu_d3d12 de_golden --parallel 4
      - name: Exact numeric readback with actual enhanced and legacy barriers
        run: python3 tools/diagnostics/d3d12_init_regressions.py --test-dir "build/$PRESET" --numeric-only
      - name: Preserve original golden and legacy Debug validation failures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/diagnostics/d3d12_init_regressions.py --test-dir "build/$PRESET"
      - name: Retain raw readbacks, reports and original scene failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng618-${{ matrix.kind }}-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/d3d12-init-*.xml
            build/${{ matrix.preset }}/d3d12-init-*.log
            build/${{ matrix.preset }}/d3d12-init-readbacks/
            build/${{ matrix.preset }}/golden-init-*/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
