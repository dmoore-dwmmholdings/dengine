# CI-only DENG-653 CPU-only profiling; do not merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng653-font-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: DENG-653 font ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-clang-cl-debug
          - config: Release
            preset: windows-clang-cl-release
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact published product and test inputs
        run: |
          source=6e52b95642491963336f20b6df58e0bc54ad306a
          git fetch --no-tags --depth=1 origin "$source"
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD "$source" > source-identity.txt
          git ls-tree "$source" tests/golden tests/unit/text src/text >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure unchanged preset
        run: cmake --preset "$PRESET"
      - name: Build original CPU font test
        id: build
        run: cmake --build --preset "$PRESET" --target test_text_import --parallel 4
      - name: Preserve original font test and 60-second deadline
        run: |
          mkdir -p "build/$PRESET/deng653"
          ninja -C "build/$PRESET" -t commands test_text_import > "build/$PRESET/deng653/compiler-commands.txt"
          ctest --test-dir "build/$PRESET" -R '^text_import.font.latin_metrics_and_determinism$' --no-tests=error --output-on-failure --test-output-size-passed 1048576 --test-output-size-failed 1048576 --output-junit "$PWD/build/$PRESET/deng653/original.xml" > "build/$PRESET/deng653/original.log" 2>&1
      - name: Separate bounded diagnostic timing, never an acceptance override
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD "build/$env:PRESET"
          $out = Join-Path $root 'deng653'
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = Join-Path $root 'tests/unit/text/test_text_import.exe'
          $info.Arguments = '--filter=font.latin_metrics_and_determinism'
          $info.WorkingDirectory = $root
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $info
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          if (!$process.Start()) { throw 'CPU font process failed to start' }
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $samples = [System.Collections.Generic.List[object]]::new()
          $timedOut = $false
          while (!$process.HasExited) {
            if ($watch.Elapsed.TotalSeconds -gt 180) {
              $timedOut = $true
              $process.Kill($true)
              break
            }
            $process.Refresh()
            if (!$process.HasExited) {
              $samples.Add(@{ wallSeconds=$watch.Elapsed.TotalSeconds; cpuSeconds=$process.TotalProcessorTime.TotalSeconds; workingSetBytes=$process.WorkingSet64 })
            }
            Start-Sleep -Milliseconds 200
          }
          $process.WaitForExit()
          $watch.Stop()
          $stdout.GetAwaiter().GetResult() | Set-Content (Join-Path $out 'diagnostic-stdout.log')
          $stderr.GetAwaiter().GetResult() | Set-Content (Join-Path $out 'diagnostic-stderr.log')
          $report = @{ purpose='separate diagnostic; original CTest deadline/results retained'; exitCode=$process.ExitCode; timedOut=$timedOut; wallSeconds=$watch.Elapsed.TotalSeconds; cpuSeconds=$process.TotalProcessorTime.TotalSeconds; samples=$samples; pid=$process.Id; source='6e52b95642491963336f20b6df58e0bc54ad306a' }
          $report | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'cpu-profile.json')
          $report | Select-Object purpose,exitCode,timedOut,wallSeconds,cpuSeconds | ConvertTo-Json
          if ($timedOut -or $process.ExitCode -ne 0) { exit 1 }
      - name: Retain CPU traces, compile flags and original deadline failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng653-font-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng653/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
