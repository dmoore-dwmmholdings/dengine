# CI-only branch; do not merge this wrapper. Product/test inputs match the stated candidate.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng644-caster-${{ github.ref }}
  cancel-in-progress: false
jobs:
  caster:
    name: DENG-644 off-camera caster (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang
            preset: linux-clang-debug
            backend: vulkan
          - os: windows-2022
            compiler: clang-cl
            preset: windows-clang-cl-debug
            backend: d3d12
    env:
      DENG644_PRESET: ${{ matrix.preset }}
      DENG644_BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify candidate source identity
        run: |
          git diff --exit-code f056b4c7cee600203b29b9fbf1571d9dc9cc60ca HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > source-identity.txt
          git rev-parse f056b4c7cee600203b29b9fbf1571d9dc9cc60ca:src HEAD:src >> source-identity.txt
          git rev-parse f056b4c7cee600203b29b9fbf1571d9dc9cc60ca:tests HEAD:tests >> source-identity.txt
          git rev-parse f056b4c7cee600203b29b9fbf1571d9dc9cc60ca:shaders HEAD:shaders >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Install existing Vulkan CI runtime
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers libasound2-dev libpipewire-0.3-dev libspa-0.2-dev
          deng644_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "$deng644_icd"
          echo "VK_DRIVER_FILES=$deng644_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$deng644_icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$deng644_icd" VK_ICD_FILENAMES="$deng644_icd" vulkaninfo --summary
      - name: Configure unchanged Debug preset
        run: cmake --preset "$DENG644_PRESET"
      - name: Build affected executable
        run: cmake --build --preset "$DENG644_PRESET" --target test_render_shadow_atlas --parallel 4
      - name: Require actual native off-camera regression
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,sys
          preset=os.environ['DENG644_PRESET']
          backend=os.environ['DENG644_BACKEND']
          root=pathlib.Path('build')/preset
          out=root/'deng644-offcamera'
          out.mkdir(parents=True,exist_ok=True)
          exe=root/'tests/unit/render'/('test_render_shadow_atlas.exe' if os.name=='nt' else 'test_render_shadow_atlas')
          env=dict(os.environ,DE_SHADOW_EVIDENCE_DIR=str(out))
          with (out/'native.log').open('wb') as log:
              result=subprocess.run([str(exe),'--filter=shadow_atlas.atlas_off_camera_caster_'+backend],env=env,stdout=log,stderr=subprocess.STDOUT,timeout=300)
          print((out/'native.log').read_text(errors='replace'))
          sys.exit(result.returncode)
          PY
      - name: Preserve raw native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng644-offcamera-${{ matrix.backend }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/deng644-offcamera/
            build/${{ matrix.preset }}/de_config_dump.txt
          if-no-files-found: error
