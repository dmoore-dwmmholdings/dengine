# CI-only DENG-618 final instrumentation check. Original matched run40467152995 is retained.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng618-numeric-${{ github.ref }}
  cancel-in-progress: false
jobs:
  numeric:
    name: DENG-618 final numeric Debug
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PRESET: windows-clang-cl-debug
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact candidate inputs
        run: |
          candidate=c04675d9c1a71838a769833015cd679ccf2a796e
          git fetch --no-tags --depth=1 origin "$candidate"
          git diff --exit-code "$candidate" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > source-identity.txt
          echo "$candidate" >> source-identity.txt
          git rev-parse "$candidate:src" HEAD:src "$candidate:tests" HEAD:tests "$candidate:shaders" HEAD:shaders >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: windows-clang-cl-debug
          cache-save: "false"
      - name: Configure unchanged Debug preset
        run: cmake --preset "$PRESET"
      - name: Build numeric executable
        run: cmake --build --preset "$PRESET" --target test_gpu_d3d12 --parallel 4
      - name: Require actual enhanced and legacy numeric cases
        run: python3 tools/diagnostics/d3d12_init_regressions.py --test-dir "build/$PRESET" --numeric-only
      - name: Independently verify all eight raw readbacks
        run: |
          python3 - <<'PY'
          import os,pathlib,re,hashlib,json
          root=pathlib.Path('build')/os.environ['PRESET']/'d3d12-init-readbacks'
          expected_names={f'{producer}-{mode}-phase{phase}.rgba' for producer in ('graphics','compute') for mode in ('enhanced','legacy') for phase in (0,1)}
          assert {p.name for p in root.glob('*.rgba')}==expected_names
          report={}
          for name in sorted(expected_names):
              data=(root/name).read_bytes()
              phase=int(re.search(r'phase(\d)',name)[1])
              expected=bytearray()
              for y in range(64):
                  for x in range(64):
                      expected.extend((17,211,59,255) if x<32 and y<32 else ((x*3+(41 if phase and x<32 else 0))&255,(y*5+17)&255,91,255))
              assert data==expected,name
              report[name]={'sha256':hashlib.sha256(data).hexdigest(),'exact_texels':4096}
          (root/'raw-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Eight raw RGBA frames match the independent pixel oracle exactly')
          PY
      - name: Retain full reports and raw readbacks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng618-final-numeric
          path: |
            source-identity.txt
            build/${{ env.PRESET }}/de_config_dump.txt
            build/${{ env.PRESET }}/d3d12-init-numeric-*.xml
            build/${{ env.PRESET }}/d3d12-init-numeric-*.log
            build/${{ env.PRESET }}/d3d12-init-readbacks/
            build/${{ env.PRESET }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
