# CI-only DENG-651 repro wrapper. Never merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng651-copy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repro:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PRESET: windows-clang-cl-debug
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact diagnostic inputs
        run: |
          candidate=243bbc84f8b55453f82a44483978009586c0d003
          git fetch --no-tags --depth=1 origin "$candidate"
          git diff --exit-code "$candidate" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > source-identity.txt
          echo "$candidate" >> source-identity.txt
          git rev-parse "$candidate:src" HEAD:src "$candidate:tests" HEAD:tests >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: windows-clang-cl-debug
          cache-save: "false"
      - name: Configure unchanged Debug preset
        run: cmake --preset "$PRESET"
      - name: Build minimal and original repro executables
        id: build
        run: cmake --build --preset "$PRESET" --target test_gpu_d3d12 de_golden --parallel 4
      - name: Require actual minimal copy-queue cases
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,sys,xml.etree.ElementTree as E,json,re
          root=pathlib.Path('build')/os.environ['PRESET'];out=root/'deng651';out.mkdir(parents=True,exist_ok=True)
          report=out/'minimal.xml'
          cmd=['ctest','--test-dir',str(root),'-R',r'^gpu_d3d12\.d3d12\.(legacy_)?texture_copy_queue_handoff(_api)?$','--parallel','1','--no-tests=error','--output-on-failure','--test-output-size-passed','1048576','--test-output-size-failed','1048576','--output-junit',str(report.resolve())]
          with (out/'minimal.log').open('w') as log:r=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT)
          cases=list(E.parse(report).iter('testcase'));assert len(cases)==4
          summary={}
          for c in cases:
              assert c.find('skipped') is None
              name=c.get('name');text=c.findtext('system-out','');mode='legacy' if '.legacy_' in name else 'enhanced'
              assert 'd3d12: '+mode+' barriers' in text
              summary[name]={'failed':c.find('failure') is not None,'error_messages':sorted(set(re.findall(r'message (\d+)', '\n'.join(l for l in text.splitlines() if '[error]' in l)))),'output':text}
          (out/'minimal-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print((out/'minimal.log').read_text())
          sys.exit(r.returncode)
          PY
      - name: Retain original UI control in both modes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,sys,shutil
          root=pathlib.Path('build')/os.environ['PRESET'];out=root/'deng651';out.mkdir(parents=True,exist_ok=True);failed=False
          for mode,value in (('enhanced','0'),('legacy','1')):
              report=out/('original-'+mode+'.xml');env=dict(os.environ,DE_D3D12_FORCE_LEGACY_BARRIERS=value)
              cmd=['ctest','--test-dir',str(root),'-R',r'^golden\.d3d12\.ui_rect_border$','--no-tests=error','--output-on-failure','--test-output-size-passed','1048576','--test-output-size-failed','1048576','--output-junit',str(report.resolve())]
              with (out/('original-'+mode+'.log')).open('w') as log:r=subprocess.run(cmd,env=env,stdout=log,stderr=subprocess.STDOUT)
              failed|=r.returncode!=0
              if (root/'golden').exists():shutil.copytree(root/'golden',out/('golden-'+mode),dirs_exist_ok=True)
          sys.exit(1 if failed else 0)
          PY
      - name: Retain full diagnostics and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng651-repro
          path: |
            source-identity.txt
            build/${{ env.PRESET }}/de_config_dump.txt
            build/${{ env.PRESET }}/deng651/
            build/${{ env.PRESET }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
