# CI: build + unit tests on every compiler x config of SPEC §19.3, plus the headless server
# builds. Every job runs one CMakePresets.json preset, so a job is reproduced locally with
#   cmake --preset <p> && cmake --build --preset <p> && ctest --preset <p>
# (docs/ci.md). GPU/golden jobs come in S10; sanitizers are in sanitizers.yml, repository checks
# in checks.yml.
#
# Two tiers (docs/ci.md): `full` runs every job; `quick` runs the jobs marked quick below. A run
# on a feature/** branch is quick, everything else is full; `gh workflow run CI -f tier=full`
# forces the full matrix on any branch.
name: CI

on:
  push:
    branches: [main, dev, "sprint/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "auto (quick on feature/**, full elsewhere), quick or full"
        type: choice
        options: [auto, quick, full]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan (${{ inputs.tier || 'auto' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          TIER: ${{ inputs.tier || 'auto' }}
          REF: ${{ github.ref }}
        run: |
          if [ "${TIER}" = auto ]; then
            case "${REF}" in refs/heads/feature/*) TIER=quick ;; *) TIER=full ;; esac
          fi
          # One job per line. quick: true marks the jobs of the quick tier. They are the ones
          # that caught most branch failures: MSVC warnings (C4127, C4702, C4389, C4200), GCC
          # flow warnings that only fire optimized (-Wmaybe-uninitialized, -Wformat-truncation),
          # and the build without the GPU and window modules.
          #
          # Windows x64: clang-cl is the primary compiler, MSVC must stay green (SPEC §2, §3.2).
          # With a compiler launcher set, Debug and Dev use /Z7 (cmake/DeBuildTypes.cmake), so
          # sccache caches cl Debug builds too. Linux x64: Clang primary, GCC for portability;
          # GCC Dev is optimized with asserts on, so its flow-based warnings fire there and not in
          # Debug (DENG-356). macOS arm64: Apple Clang. Headless server builds: DE_HEADLESS=ON
          # (SPEC §4.2).
          jobs=$(cat <<'EOF'
          { "name": "windows clang-cl Debug", "os": "windows-2022", "compiler": "clang-cl", "preset": "windows-clang-cl-debug" }
          { "name": "windows clang-cl Release", "os": "windows-2022", "compiler": "clang-cl", "preset": "windows-clang-cl-release" }
          { "name": "windows msvc Debug", "os": "windows-2022", "compiler": "msvc", "preset": "windows-msvc-debug", "quick": true }
          { "name": "windows msvc Release", "os": "windows-2022", "compiler": "msvc", "preset": "windows-msvc-release" }
          { "name": "linux clang Debug", "os": "ubuntu-24.04", "compiler": "clang", "preset": "linux-clang-debug" }
          { "name": "linux clang Release", "os": "ubuntu-24.04", "compiler": "clang", "preset": "linux-clang-release" }
          { "name": "linux gcc Debug", "os": "ubuntu-24.04", "compiler": "gcc", "preset": "linux-gcc-debug" }
          { "name": "linux gcc Dev", "os": "ubuntu-24.04", "compiler": "gcc", "preset": "linux-gcc-dev", "quick": true }
          { "name": "linux gcc Release", "os": "ubuntu-24.04", "compiler": "gcc", "preset": "linux-gcc-release" }
          { "name": "macos apple-clang Debug", "os": "macos-14", "compiler": "apple-clang", "preset": "macos-debug" }
          { "name": "macos apple-clang Release", "os": "macos-14", "compiler": "apple-clang", "preset": "macos-release" }
          { "name": "headless linux Release", "os": "ubuntu-24.04", "compiler": "clang", "preset": "linux-headless-release", "quick": true }
          { "name": "headless windows Release", "os": "windows-2022", "compiler": "clang-cl", "preset": "windows-headless-release" }
          EOF
          )
          if [ "${TIER}" = quick ]; then
            matrix=$(jq -cs '{include: [.[] | select(.quick)]}' <<<"${jobs}")
          else
            matrix=$(jq -cs '{include: .}' <<<"${jobs}")
          fi
          echo "tier: ${TIER}"
          jq . <<<"${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cat "build/${PRESET}/de_config_dump.txt"

      - name: Build
        shell: bash
        run: cmake --build --preset "${PRESET}"

      - name: Test
        shell: bash
        run: ctest --preset "${PRESET}" --output-on-failure --parallel 4

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/de_config_dump.txt
          if-no-files-found: ignore
          retention-days: 7
