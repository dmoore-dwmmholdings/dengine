# CI-only remote offscreen lifecycle qualification. Do not merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng645-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: DENG-645 hosted ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            compiler: clang-cl
            preset: windows-clang-cl-debug
            backend: d3d12
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify immutable source and unchanged fixture
        run: |
          source=d7ed16d585cb2ea61de8842ad698e1ba1f121039
          git fetch --no-tags --depth=1 origin "$source"
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD "$source" > source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure original Debug preset
        run: cmake --preset "$PRESET"
      - name: Build only public offscreen fixture
        id: build
        run: cmake --build --preset "$PRESET" --target de_offscreen_capture --parallel 4
      - name: Verify real PE exports and deployed test runtimes
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,subprocess,sys,json,hashlib
          build=(pathlib.Path('build')/os.environ['PRESET']).resolve()
          exe=build/'tests/unit/host/de-offscreen-capture.exe'
          out=build/'deng645-sdk';out.mkdir()
          manifest=out/'fixture-manifest.txt';manifest.write_text(str(exe)+'\n')
          with (out/'exports.log').open('w') as log:
              subprocess.run([sys.executable,'tools/check_agility/check_agility.py','--manifest',str(manifest),'--expect-some'],stdout=log,stderr=subprocess.STDOUT,check=True)
          files=[exe,exe.parent/'D3D12/D3D12Core.dll',exe.parent/'D3D12/d3d12SDKLayers.dll',exe.parent/'d3d10warp.dll']
          report={str(p.relative_to(build)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          (out/'binary-runtime-hashes.json').write_text(json.dumps(report,indent=2)+'\n')
          print((out/'exports.log').read_text())
          PYCODE
      - name: Explicit remote native opt-in, six lifecycles and raw readbacks
        run: |
          binary="build/$PRESET/tests/unit/host/de-offscreen-capture"
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          python3 tests/unit/host/check_offscreen_capture.py "$binary" --backend "$BACKEND" --allow-native --output "build/$PRESET/deng645-$BACKEND"
      - name: Independently verify complete native captures and lifecycle reports
        run: |
          python3 - <<'PY'
          import pathlib,os,json
          out=pathlib.Path('build')/os.environ['PRESET']/('deng645-'+os.environ['BACKEND'])
          facts=json.loads((out/'facts.json').read_text())
          assert facts['status']=='PASS' and len(facts['executions'])==7
          native=[e for e in facts['executions'] if 'report' in e]
          assert len(native)==6
          assert {(e['report']['pipeline'],e['report']['failure_stage']) for e in native}=={(0,0),(1,0),(0,1),(0,2),(0,3),(0,4)}
          assert all(e['report']['actual_backend']=={'d3d12':1,'vulkan':2}[os.environ['BACKEND']] for e in native)
          captures=list(out.glob('*.rgba'));assert len(captures)==2
          assert all(p.read_bytes()==bytes([64,128,191,255])*(64*48) for p in captures)
          for row in native:
              log=(out/(row['name']+'.log')).read_text();normalized=log.replace(chr(92),'/').lower()
              assert '/d3d12/d3d12core.dll' in normalized
              assert 'enhanced barriers yes' in normalized
              for line in log.splitlines():
                  if '[error]' in line:
                      assert row['report']['failure_stage'] and '[error][host]' in line and 'DE_ERR_CANCELLED' in line,line
                  assert 'Validation Error' not in line and 'VUID-' not in line and 'D3D12 ERROR' not in line,line
          print('Six actual lifecycles, two exact native captures; no desktop/Space or hardware-performance claim')
          PY
      - name: Retain source, raw pixels and all failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng645-hosted-${{ matrix.backend }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng645-*/
          if-no-files-found: error
