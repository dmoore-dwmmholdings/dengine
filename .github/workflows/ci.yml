# CI-only remote offscreen lifecycle qualification. Do not merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng645-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: DENG-645 hosted ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            compiler: clang-cl
            preset: windows-clang-cl-debug
            backend: d3d12
          - os: ubuntu-24.04
            compiler: clang
            preset: linux-clang-debug
            backend: vulkan
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: ${{ matrix.backend }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify immutable source and unchanged fixture
        run: |
          source=7f5b0f55b95c49187b3e1c206e47d88b71920a5b
          git fetch --no-tags --depth=1 origin "$source"
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD "$source" > source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Isolated hosted lavapipe and validation layers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers libasound2-dev libpipewire-0.3-dev libspa-0.2-dev
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" vulkaninfo --summary
      - name: Configure original Debug preset
        run: cmake --preset "$PRESET"
      - name: Build only public offscreen fixture
        id: build
        run: cmake --build --preset "$PRESET" --target de_offscreen_capture --parallel 4
      - name: Explicit remote native opt-in, six lifecycles and raw readbacks
        run: |
          binary="build/$PRESET/tests/unit/host/de-offscreen-capture"
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          python3 tests/unit/host/check_offscreen_capture.py "$binary" --backend "$BACKEND" --allow-native --output "build/$PRESET/deng645-$BACKEND"
      - name: Independently verify complete native captures and lifecycle reports
        run: |
          python3 - <<'PY'
          import pathlib,os,json
          out=pathlib.Path('build')/os.environ['PRESET']/('deng645-'+os.environ['BACKEND'])
          facts=json.loads((out/'facts.json').read_text())
          assert facts['status']=='PASS' and len(facts['executions'])==7
          native=[e for e in facts['executions'] if 'report' in e]
          assert len(native)==6
          assert {(e['report']['pipeline'],e['report']['failure_stage']) for e in native}=={(0,0),(1,0),(0,1),(0,2),(0,3),(0,4)}
          assert all(e['report']['actual_backend']=={'d3d12':1,'vulkan':2}[os.environ['BACKEND']] for e in native)
          captures=list(out.glob('*.rgba'));assert len(captures)==2
          assert all(p.read_bytes()==bytes([64,128,191,255])*(64*48) for p in captures)
          print('Six actual lifecycles, two exact native captures; no desktop/Space or hardware-performance claim')
          PY
      - name: Retain source, raw pixels and all failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng645-hosted-${{ matrix.backend }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng645-*/
          if-no-files-found: error
