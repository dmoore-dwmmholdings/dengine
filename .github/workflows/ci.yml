# CI-only causal control; never merge this wrapper into the product branch.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng644-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control:
    name: DENG-644 Vulkan timeout control (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            product: 04041d502eefbeb036799e21792a6cde4f398a47
          - variant: candidate
            product: f056b4c7cee600203b29b9fbf1571d9dc9cc60ca
    env:
      DENG644_VARIANT: ${{ matrix.variant }}
      DENG644_PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Pin product code and identical test fixtures
        run: |
          git diff --exit-code f056b4c7cee600203b29b9fbf1571d9dc9cc60ca HEAD -- . ':(exclude).github/workflows/ci.yml'
          git fetch --no-tags --depth=1 origin 04041d502eefbeb036799e21792a6cde4f398a47
          if [ "$DENG644_VARIANT" = baseline ]; then
            git restore --source=04041d502eefbeb036799e21792a6cde4f398a47 -- src/render/shadows/shadow_atlas.c src/render/shadows/shadows_internal.h
          fi
          git diff --exit-code "$DENG644_PRODUCT" -- src include shaders cmake third_party CMakeLists.txt CMakePresets.json
          git diff --exit-code f056b4c7cee600203b29b9fbf1571d9dc9cc60ca -- tests
          git rev-parse HEAD > source-identity.txt
          echo "$DENG644_PRODUCT" >> source-identity.txt
          git diff --stat >> source-identity.txt
          sha256sum src/render/shadows/shadow_atlas.c src/render/shadows/shadows_internal.h tests/unit/render/test_shadow_atlas.c tests/unit/render/lighting_fixture.h >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: linux-clang-debug
          cache-save: "false"
      - name: Install existing Vulkan CI runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers libasound2-dev libpipewire-0.3-dev libspa-0.2-dev
          deng644_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "$deng644_icd"
          echo "VK_DRIVER_FILES=$deng644_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$deng644_icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$deng644_icd" VK_ICD_FILENAMES="$deng644_icd" vulkaninfo --summary
      - name: Configure unchanged Debug preset
        run: cmake --preset linux-clang-debug
      - name: Build same atlas executable
        id: build
        run: cmake --build --preset linux-clang-debug --target test_render_shadow_atlas --parallel 4
      - name: Run original atlas order and original cold-start conditions
        run: |
          mkdir -p build/linux-clang-debug/deng644-control/native
          export DE_SHADOW_EVIDENCE_DIR="$GITHUB_WORKSPACE/build/linux-clang-debug/deng644-control/native"
          ctest --test-dir build/linux-clang-debug -V --parallel 1 --no-tests=error --output-junit "$GITHUB_WORKSPACE/build/linux-clang-debug/deng644-control/controls.xml" -R '^render_shadow_atlas\..*_vulkan$' -E 'atlas_off_camera_caster_vulkan$' > build/linux-clang-debug/deng644-control/controls.log 2>&1
      - name: Preserve both successful and failed control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng644-vulkan-control-${{ matrix.variant }}
          path: |
            source-identity.txt
            build/linux-clang-debug/deng644-control/
            build/linux-clang-debug/Testing/Temporary/LastTest.log
            build/linux-clang-debug/de_config_dump.txt
          if-no-files-found: error
