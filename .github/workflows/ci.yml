# CI-only DENG-651 matched qualification wrapper. Do not merge this override.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deng651-copy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: DENG-651 ${{ matrix.kind }} ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: candidate
            config: Debug
            preset: windows-clang-cl-debug
          - kind: candidate
            config: Release
            preset: windows-clang-cl-release
          - kind: baseline
            config: Debug
            preset: windows-clang-cl-debug
    env:
      PRESET: ${{ matrix.preset }}
      DENG651_KIND: ${{ matrix.kind }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify matched runtime and exact fixtures
        run: |
          candidate=06482255ee2808975f4f4736155a127230347d29
          baseline=1cda72984c25241e1026316dd11a2bf18d203714
          git fetch --no-tags --depth=1 origin "$candidate" "$baseline"
          git diff --exit-code "$candidate" HEAD -- . ':(exclude).github/workflows/ci.yml'
          runtime="$candidate"
          if [ "$DENG651_KIND" = baseline ]; then
            runtime="$baseline"
            git restore --source="$baseline" -- src/gpu/d3d12/d3d12_barriers.c
          fi
          git diff --exit-code "$runtime" -- src include shaders cmake third_party CMakeLists.txt CMakePresets.json
          git diff --exit-code "$candidate" -- tests tools
          git rev-parse HEAD > source-identity.txt
          echo "$runtime" >> source-identity.txt
          echo "$candidate" >> source-identity.txt
          sha256sum src/gpu/d3d12/d3d12_barriers.c tests/unit/gpu/d3d12/test_d3d12_cmd.c tests/unit/gpu/d3d12/test_d3d12_barrier_tables.c >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure unchanged preset
        run: cmake --preset "$PRESET"
      - name: Build copy and original golden executables
        id: build
        run: cmake --build --preset "$PRESET" --target test_gpu_d3d12 de_golden --parallel 4
      - name: Actual copy-queue regressions and unchanged controls
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,sys,xml.etree.ElementTree as E,json,re
          root=pathlib.Path('build')/os.environ['PRESET'];out=root/'deng651';out.mkdir(parents=True,exist_ok=True)
          native=['texture_copy_queue_handoff','legacy_texture_copy_queue_handoff','texture_copy_queue_handoff_api','legacy_texture_copy_queue_handoff_api','copy_queue_bc7_mips','legacy_copy_queue_bc7_mips','clear_readback','copy_bc7_mips','cross_queue_timeline','legacy_barriers_forced']
          pure=['legacy_copy_texture_common_state','first_uav_write_initializes_render_target_metadata','legacy_first_uav_initialization_access','barrier_translation_table']
          names=native+pure;report=out/'controls.xml';pattern=r'^gpu_d3d12\.d3d12\.('+'|'.join(names)+')$'
          cmd=['ctest','--test-dir',str(root),'-R',pattern,'--parallel','1','--no-tests=error','--output-on-failure','--test-output-size-passed','1048576','--test-output-size-failed','1048576','--output-junit',str(report.resolve())]
          with (out/'controls.log').open('w') as log:r=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT)
          cases=list(E.parse(report).iter('testcase'));assert len(cases)==14
          assert {c.get('name') for c in cases}=={'gpu_d3d12.d3d12.'+n for n in names}
          summary={}
          for c in cases:
              assert c.find('skipped') is None
              name=c.get('name');short=name.removeprefix('gpu_d3d12.d3d12.');text=c.findtext('system-out','');mode='legacy' if short.startswith('legacy_') else 'enhanced'
              if short in native:assert 'd3d12: '+mode+' barriers' in text
              summary[name]={'failed':c.find('failure') is not None,'error_messages':sorted(set(re.findall(r'message (\d+)', '\n'.join(l for l in text.splitlines() if '[error]' in l))))}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print((out/'controls.log').read_text())
          sys.exit(r.returncode)
          PY
      - name: Preserve DENG-618 numeric initialization coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/diagnostics/d3d12_init_regressions.py --test-dir "build/$PRESET" --numeric-only
      - name: Retain all original text and UI scene failures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/diagnostics/d3d12_init_regressions.py --test-dir "build/$PRESET"
      - name: Retain full reports, pixels and source identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deng651-${{ matrix.kind }}-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng651/
            build/${{ matrix.preset }}/d3d12-init-*
            build/${{ matrix.preset }}/golden-init-*/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
