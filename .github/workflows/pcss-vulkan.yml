name: PCSS Vulkan acceptance
run-name: ${{ inputs.renderer_regressions && 'Renderer bug regressions' || 'PCSS Vulkan acceptance' }}

on:
  workflow_dispatch:
    inputs:
      renderer_regressions:
        description: "Run focused WARP crash and text-reference checks instead of PCSS"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pcss-vulkan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renderer-regressions:
    if: ${{ inputs.renderer_regressions }}
    uses: ./.github/workflows/renderer-regressions.yml
  pcss:
    if: ${{ !inputs.renderer_regressions }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRESET: linux-clang-debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: linux-clang-debug
          cache-save: "false"
      - name: Select actual lavapipe with validation
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
          VK_DRIVER_FILES="${icd}" VK_ICD_FILENAMES="${icd}" vulkaninfo --summary
      - name: Build focused acceptance targets
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target test_render_pcss_contact test_gpu_vulkan
      - name: Run PCSS numerical and retirement checks
        run: >-
          ctest --preset "${PRESET}" --no-tests=error -V
          --output-junit pcss-vulkan.xml
          -R '^(render_pcss_contact\..*_vulkan|gpu_vulkan\.vk\.(bindless_indices|readback_allocation_reuse))$'
      - name: Reject skipped hardware coverage
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse(f"build/{os.environ['PRESET']}/pcss-vulkan.xml")
          cases = report.findall(".//testcase")
          assert cases, "no actual Vulkan test cases"
          for case in cases:
              assert not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")), case.attrib
          for required in ("pcss_directional_angular_vulkan", "pcss_frame_deterministic_vulkan", "bindless_indices", "readback_allocation_reuse"):
              assert any(case.attrib["name"].endswith(required) for case in cases), required
      - name: Preserve acceptance logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcss-vulkan
          path: |
            build/linux-clang-debug/pcss-vulkan.xml
            build/linux-clang-debug/Testing/Temporary/
          if-no-files-found: warn
