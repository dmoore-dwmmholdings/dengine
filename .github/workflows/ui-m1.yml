name: UI M1 acceptance

on:
  pull_request:
    paths:
      - "src/ui/**"
      - "src/ecs/**"
      - "tests/unit/ui/test_draw_list.c"
      - ".github/workflows/ui-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hud:
    name: 2000 widgets, Dev on M1
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native M1 hardware
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          import subprocess

          chip = subprocess.check_output(
              ["sysctl", "-n", "machdep.cpu.brand_string"], text=True).strip()
          hardware = {"cpu": chip, "architecture": platform.machine(),
                      "logical_cpus": os.cpu_count(), "os": platform.platform()}
          print(json.dumps(hardware, indent=2))
          with open("ui-m1-hardware.json", "w") as output:
              json.dump(hardware, output, indent=2)
          if chip not in ("Apple M1", "Apple M1 (Virtual)") or hardware["architecture"] != "arm64":
              raise SystemExit("This runner cannot qualify the original M1 performance gate")
          PY
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: apple-clang
          cache-key: macos-dev-ui-m1
          cache-save: "false"
      - name: Configure original Dev preset
        shell: bash
        run: |
          cmake --preset macos-dev
          cat build/macos-dev/de_config_dump.txt
      - name: Build UI draw test
        shell: bash
        run: cmake --build --preset macos-dev --target test_ui_draw
      - name: Run original HUD workload and allocation gates
        shell: bash
        run: |
          ctest --test-dir build/macos-dev --no-tests=error -V \
            --output-junit "${GITHUB_WORKSPACE}/build/macos-dev/ui-m1.xml" \
            -R '^ui_draw\.two_thousand_widgets_static_zero_alloc_build_extract$'
      - name: Require actual execution
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("build/macos-dev/ui-m1.xml").getroot().iter("testcase"))
          if len(cases) != 1 or any(c.find(tag) is not None for c in cases
                                    for tag in ("skipped", "failure", "error")):
              raise SystemExit("M1 acceptance requires one actual passing HUD benchmark case")
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-m1-acceptance
          path: |
            ui-m1-hardware.json
            build/macos-dev/ui-m1.xml
            build/macos-dev/de_config_dump.txt
            build/macos-dev/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7
