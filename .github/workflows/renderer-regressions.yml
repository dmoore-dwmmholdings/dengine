name: DENG-661 MSVC tooltip compiler regression (CI only)
on:
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: Debug, preset: windows-msvc-debug}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify held candidate and CI wrapper provenance
        shell: bash
        run: |
          git diff --exit-code eb797b09 HEAD -- . ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng661-msvc.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs/d3d12/base tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: msvc
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Configure original strict MSVC preset
        shell: bash
        run: cmake --preset "${PRESET}"
      - name: Reproduce original conversion failure and verify corrected CPU tests
        shell: bash
        run: python .github/scripts/deng661-msvc.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng661-msvc-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng661-msvc/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
