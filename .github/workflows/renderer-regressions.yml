name: DENG-656 native popup evidence (validation only)
on:
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug, backend: d3d12}
          - {os: ubuntu-24.04, compiler: clang, preset: linux-clang-debug, backend: vulkan}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PRESET: ${{ matrix.preset }}
      DE_UI_POPUP_NATIVE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Original runtime control
        shell: bash
        run: |
          mkdir -p evidence/before evidence/after
          git rev-parse HEAD > evidence/validation-commit.txt
          git restore --source=d6d4f79ce41bbdd237c3bc48b29bb3d80f92a41f -- src/ui/widgets/advanced.c src/ui/widgets/advanced_internal.h src/ui/widgets/dropdown.c src/ui/widgets/tooltip.c
          git diff > evidence/original-runtime.diff
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target test_ui_popup_native
          set +e
          DE_UI_POPUP_EVIDENCE_DIR="$PWD/evidence/before" ctest --test-dir "build/${PRESET}" -R '^ui_popup_native\.ui_popup_native\.generated_widgets_stay_on_world_panel$' --no-tests=error --output-on-failure --test-output-size-failed 1048576 --output-junit "$PWD/evidence/before/results.xml" > evidence/before/ctest.log 2>&1
          result=$?
          set -e
          cat evidence/before/ctest.log
          test "${result}" -ne 0
          cp "build/${PRESET}/Testing/Temporary/LastTest.log" evidence/before/LastTest.log
      - name: Fixed runtime
        shell: bash
        run: |
          git restore -- src/ui/widgets/advanced.c src/ui/widgets/advanced_internal.h src/ui/widgets/dropdown.c src/ui/widgets/tooltip.c
          git diff --exit-code
          cmake --build --preset "${PRESET}" --target test_ui_popup_native test_ui_layout test_ui_world_pixel
          DE_UI_POPUP_EVIDENCE_DIR="$PWD/evidence/after" ctest --test-dir "build/${PRESET}" -R '^ui_popup_native\.ui_popup_native\.generated_widgets_stay_on_world_panel$' --no-tests=error --output-on-failure --test-output-size-passed 1048576 --test-output-size-failed 1048576 --output-junit "$PWD/evidence/after/results.xml"
          cp "build/${PRESET}/Testing/Temporary/LastTest.log" evidence/after/LastTest.log
          ctest --test-dir "build/${PRESET}" -R '^ui_layout\.ui_advanced\.(generated_.*|dropdown_flips_selects_once_and_cancel_preserves_value|tabs_generate_headers_hide_inactive_pages_and_emit_change|tooltip_delay_focus_safe_bounds_and_press_hide|actual_escape_and_outside_click_close_dropdown_without_selection)$|^ui_world_pixel\.ui_world\.(per_root_panel_pixels_preserve_screen_root|popups_use_panel_extent_scale_and_ignore_screen_safe_insets|popup_percent_and_oversize_clamps_are_independent_between_panels)$' --no-tests=error --output-on-failure --output-junit "$PWD/evidence/after/cpu.xml"
      - name: Verify execution and captures
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for phase in ('before', 'after'):
              cases = ET.parse(f'evidence/{phase}/results.xml').findall('.//testcase')
              assert len(cases) == 1
              assert cases[0].find('skipped') is None
              assert (cases[0].find('failure') is not None) == (phase == 'before')
              for image in ('baseline', 'dropdown', 'tooltip'):
                  assert Path(f'evidence/{phase}/{image}.ppm').stat().st_size == 786447
          cases = ET.parse('evidence/after/cpu.xml').findall('.//testcase')
          assert len(cases) == 11, len(cases)
          assert all(c.find(t) is None for c in cases for t in ('skipped', 'failure', 'error'))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng656-${{ matrix.backend }}
          path: |
            evidence/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
