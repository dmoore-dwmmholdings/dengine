name: DENG-604 verified moving-scene oracle (CI only)
on:
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: Debug, preset: windows-clang-cl-debug}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: d3d12
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify held candidate and CI wrapper provenance
        shell: bash
        run: |
          git diff --exit-code 8c53f288 HEAD -- . ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng604-scene-readback.py' ':(exclude).github/scripts/deng604-authored-geometry.py' ':(exclude).github/scripts/deng604-scene-hit-oracle.py' ':(exclude)shaders/ssr/ssr_resolve.slang' ':(exclude)src/render/passes/ssr/ssr.c' ':(exclude)src/render/passes/ssr/scene_history.c' ':(exclude)src/render/passes/ssr/ssr_internal.h' ':(exclude)tests/golden/base_tier/base_tier_scenes.c'
          python - <<'PYCODE'
          import pathlib,subprocess
          p=pathlib.Path('shaders/ssr/ssr_resolve.slang').read_bytes()
          marker=b'// CI-ONLY actual-scene footprint readback;'
          product=subprocess.check_output(['git','show','8c53f288:shaders/ssr/ssr_resolve.slang'])
          assert p.split(marker)[0].rstrip()==product.rstrip()
          PYCODE
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs/d3d12/base tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Build original SSR fixture plus focused regression
        shell: bash
        run: |
          cmake --preset "${PRESET}"
      - name: Capture exact candidate image and actual hit queries
        shell: bash
        run: python .github/scripts/deng604-scene-readback.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng604-verified-moving-scene-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng604-scene-readback/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
