name: Renderer bug regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-bug-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goldens:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug, backend: d3d12, expected: 38}
          - {os: ubuntu-24.04, compiler: clang, preset: linux-clang-debug, backend: vulkan, expected: 4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: ${{ matrix.backend }}
      EXPECTED: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select validated lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Build golden harness only
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target de_golden
      - name: Run original crash cases and text references
        id: goldens
        shell: bash
        run: |
          if [ "${BACKEND}" = d3d12 ]; then
            pattern='^golden\.d3d12\.(views_split_screen|materials_(gallery_ibl|gallery_lights|furnace|khr_samples|layers_furnace)|shadows_(csm|local|pcss_contact)_(medium|high|off)|ao_gtao_(medium|high|off)|reflections_ssr_probes_(medium|high|off)|gi_probes_ssgi_(medium|high|off)|refraction_ss_(medium|high|off)|rt_(shadows_pole|restir_many_lights|ao_corner|reflections_mirror_rough|gi_cornell|refraction_glass|foliage_shadow)_base|text_(msdf_scales|outline_shadow|bitmap_pixel|world_text))$'
          else
            pattern='^golden\.vulkan\.text_(msdf_scales|outline_shadow|bitmap_pixel|world_text)$'
          fi
          # Keep each scene's existing settings, comparison thresholds and 300-second limit.
          ctest --test-dir "build/${PRESET}" --no-tests=error --output-on-failure \
            --output-junit renderer-regressions.xml -R "${pattern}"
      - name: Require actual execution of every selected scene
        if: ${{ !cancelled() && steps.goldens.outcome != 'skipped' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("build") / os.environ["PRESET"]
          cases = ET.parse(root / "renderer-regressions.xml").findall(".//testcase")
          assert len(cases) == int(os.environ["EXPECTED"]), len(cases)
          for case in cases:
              assert case.find("skipped") is None, case.attrib
              scene = case.attrib["name"].split(".", 2)[2]
              png = root / "golden" / os.environ["BACKEND"] / "base" / (scene + ".png")
              assert png.is_file() and png.stat().st_size > 0, png
      - name: Preserve actual captures and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-regressions-${{ matrix.backend }}
          path: |
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/renderer-regressions.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
