name: DENG-659 packed Base-tier acceptance (CI only)
on:
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: Windows-Debug, os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug, backend: d3d12}
          - {config: Windows-Release, os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-release, backend: d3d12}
          - {config: Windows-Shipping, os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-shipping, backend: d3d12}
          - {config: Linux-Release, os: ubuntu-24.04, compiler: clang, preset: linux-clang-release, backend: vulkan}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BACKEND: ${{ matrix.backend }}
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - name: Verify only reviewed references and CI wrapper differ
        shell: bash
        run: |
          git diff --exit-code b82abe648e73b9641a4ac85407fe34a996a2a742 HEAD -- . ':(exclude)tests/golden/refs/d3d12/base/reflections_ssr_probes_medium.png' ':(exclude)tests/golden/refs/d3d12/base/reflections_ssr_probes_high.png' ':(exclude)tests/golden/base_tier/base_tier_scenes.c' ':(exclude)tests/golden/harness/cooked_assets.c' ':(exclude)tests/golden/harness/test_cooked_assets.c' ':(exclude)tests/golden/CMakeLists.txt' ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng659-acceptance.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs/d3d12/base tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select validated lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Build original packed-asset and golden targets
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target test_golden_assets de_golden --parallel 4
      - name: Check original Base-tier, text/UI, packed runtime and repeated goldens
        shell: bash
        run: python .github/scripts/deng659-acceptance.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng659-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng659/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
