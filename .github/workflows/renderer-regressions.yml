name: DENG-658 Windows SSR reference acceptance (CI only)
on:
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: Debug, preset: windows-clang-cl-debug}
          - {config: Release, preset: windows-clang-cl-release}
          - {config: Shipping, preset: windows-clang-cl-shipping}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - name: Verify only reviewed references and CI wrapper differ
        shell: bash
        run: |
          git diff --exit-code b82abe648e73b9641a4ac85407fe34a996a2a742 HEAD -- . ':(exclude)tests/golden/refs/d3d12/base/reflections_ssr_probes_medium.png' ':(exclude)tests/golden/refs/d3d12/base/reflections_ssr_probes_high.png' ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng658-acceptance.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs/d3d12/base tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Build original packed-asset and golden targets
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target test_golden_assets de_golden --parallel 4
      - name: Check unchanged SSR runtime and repeated original goldens
        shell: bash
        run: python .github/scripts/deng658-acceptance.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng658-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng658/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
