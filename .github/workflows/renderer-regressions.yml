name: DENG-604 shaded-normal regression (CI only)
on:
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: Debug, preset: windows-clang-cl-debug}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify held candidate and CI wrapper provenance
        shell: bash
        run: |
          git diff --exit-code b82abe648e73b9641a4ac85407fe34a996a2a742 HEAD -- . ':(exclude)shaders/ssr/ssr_common.slang' ':(exclude)shaders/ssr/ssr_resolve.slang' ':(exclude)tests/unit/render/test_ssr.c' ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng604-shading-normal.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs/d3d12/base tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang-cl
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Build original SSR fixture plus focused regression
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target test_render_ssr --parallel 4
      - name: Compare original sampler control and held candidate
        shell: bash
        run: python .github/scripts/deng604-shading-normal.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng604-shading-normal-${{ matrix.config }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng604-shading-normal/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
