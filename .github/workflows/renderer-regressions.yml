name: DENG-660 single-handle quick qualification (CI only)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PRESET: ${{ matrix.preset }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify product and diagnostic provenance
        shell: bash
        run: |
          git diff --exit-code 280c51ad1009919a5fd05ee67f7a24c5b24b1651 HEAD -- . ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng660-cluster-qualification.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD shaders/lighting/light_cull.slang tests/unit/render/test_clustered_lights.c >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select hosted lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Build original acceptance targets
        shell: bash
        run: |
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target de_golden test_render_clustered_lights --parallel 4
      - name: Compare original shader control and candidate
        shell: bash
        run: python .github/scripts/deng660-cluster-qualification.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng660-clusters-${{ matrix.preset }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng660-clusters/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
