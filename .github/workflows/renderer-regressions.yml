name: DENG-604 current-main Vulkan baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deng604-vulkan-references-${{ github.ref }}
  cancel-in-progress: false

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRESET: linux-clang-debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: clang
          cache-key: linux-clang-debug
          cache-save: "false"
      - name: Select validated lavapipe
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Verify product identity and build original golden target
        id: build
        shell: bash
        run: |
          mkdir -p build/reference-evidence
          git rev-parse HEAD > build/reference-evidence/capture-commit.txt
          git diff --exit-code 65846104c52f1270e5492e5c70a0de72faaa39c1 -- . ':!.github/workflows/renderer-regressions.yml'
          git ls-files shaders src include tests/golden | sort | xargs sha256sum > build/reference-evidence/source-sha256.txt
          vulkaninfo --summary > build/reference-evidence/vulkaninfo.txt 2>&1
          cmake --preset "${PRESET}"
          cmake --build --preset "${PRESET}" --target de_golden
      - name: Capture original two scenes without changing limits or references
        id: captures
        shell: bash
        run: |
          ctest --test-dir "build/${PRESET}" --parallel 1 --no-tests=error --output-on-failure \
            --test-output-size-passed 1048576 --test-output-size-failed 1048576 \
            --output-junit targeted-reflections.xml \
            -R '^golden\.vulkan\.reflections_ssr_probes_(medium|high)$'
      - name: Audit execution and capture presence
        if: ${{ !cancelled() && steps.captures.outcome != 'skipped' }}
        shell: python
        run: |
          import hashlib, json, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path("build/linux-clang-debug")
          summary = {"product": "65846104c52f1270e5492e5c70a0de72faaa39c1", "cases": []}
          errors = []
          try:
              cases = ET.parse(base / "targeted-reflections.xml").findall(".//testcase")
              names = {"golden.vulkan.reflections_ssr_probes_" + q for q in ("medium", "high")}
              if {c.attrib["name"] for c in cases} != names or len(cases) != 2:
                  errors.append("selected test names/count differ")
              for c in cases:
                  scene = c.attrib["name"].split(".", 2)[2]
                  png = base / "golden/vulkan/base" / (scene + ".png")
                  row = {"name": c.attrib["name"], "attributes": c.attrib,
                         "skipped": c.find("skipped") is not None,
                         "failed": c.find("failure") is not None,
                         "error": c.find("error") is not None,
                         "png": str(png), "present": png.is_file()}
                  output = c.findtext("system-out", "")
                  row["validated_lavapipe"] = bool(re.search(r'vulkan: "llvmpipe .*validation on', output))
                  row["gpu_errors"] = bool(re.search(r"\[(?:error|fatal)\]\[(?:gpu|render)\]|Validation Error|VUID-", output))
                  if not row["validated_lavapipe"] or row["gpu_errors"]:
                      errors.append(scene + ": backend/validation audit failed")
                  if png.is_file():
                      row["sha256"] = hashlib.sha256(png.read_bytes()).hexdigest()
                  if row["skipped"] or row["error"] or not row["present"]:
                      errors.append(scene + ": missing real capture")
                  summary["cases"].append(row)
          except Exception as e:
              errors.append(repr(e))
          summary["errors"] = errors
          Path("build/reference-evidence/summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          assert not errors, errors
      - name: Preserve captures and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deng604-vulkan-reference-capture
          path: |
            build/reference-evidence/
            build/linux-clang-debug/golden/
            build/linux-clang-debug/targeted-reflections.xml
            build/linux-clang-debug/Testing/Temporary/LastTest.log
          if-no-files-found: warn
