name: DENG-604 query-checkpoint qualification (CI only)
on:
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug, backend: d3d12}
          - {os: ubuntu-24.04, compiler: clang, preset: linux-clang-debug, backend: vulkan}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: ${{ matrix.backend }}
      DE_D3D12_FORCE_LEGACY_BARRIERS: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify bounded source and reference provenance
        shell: bash
        run: |
          git diff --exit-code 153c6675 HEAD -- . ':(exclude).github/workflows/renderer-regressions.yml' ':(exclude).github/scripts/deng604-query-checkpoint.py'
          git rev-parse HEAD > source-identity.txt
          git ls-tree HEAD tests/golden/refs tests/golden/scenes.toml >> source-identity.txt
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select validated lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Configure unchanged original tests
        shell: bash
        run: cmake --preset "${PRESET}"
      - name: Retain original baseline and candidate results
        shell: bash
        run: |
          cmake --build --preset "${PRESET}" --target test_render_ssr --parallel 4
          python .github/scripts/deng604-query-checkpoint.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng604-query-checkpoint-${{ matrix.backend }}
          path: |
            source-identity.txt
            build/${{ matrix.preset }}/de_config_dump.txt
            build/${{ matrix.preset }}/deng604-query-checkpoint/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
