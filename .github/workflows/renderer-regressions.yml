name: DENG-655 native tooltip evidence (validation only)
on:
  workflow_call:
    inputs:
      warp_crashes:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: clang-cl, preset: windows-clang-cl-debug, backend: d3d12}
          - {os: ubuntu-24.04, compiler: clang, preset: linux-clang-debug, backend: vulkan}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PRESET: ${{ matrix.preset }}
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
      - uses: ./.github/actions/setup-dengine
        with:
          compiler: ${{ matrix.compiler }}
          cache-key: ${{ matrix.preset }}
          cache-save: "false"
      - name: Select validated lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -q
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
          test -n "${icd}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
      - name: Original/fixed native tooltip evidence
        shell: bash
        run: python .github/scripts/deng655-evidence.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deng655-${{ matrix.backend }}
          path: |
            evidence/
            build/${{ matrix.preset }}/golden/
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: error
