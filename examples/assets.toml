# assets.toml — DEngine asset manifest example (SPEC.md §11.2)
# Asset IDs are stable logical paths. Sources are relative to asset_root.
# Globs in bundles match asset IDs, not files.

[project]
asset_root = "assets"
version    = 1
include    = ["characters.toml", "audio.toml"]

# ---------- Per-type defaults (overridable per asset) ----------
[defaults.texture]
compression = "auto"        # bc7 (color), bc5 (normal), bc4 (mask), bc6h (hdr)
mips        = true
srgb        = true

[defaults.model]
generate_lods   = true
lod_error       = 0.01      # screen-space error target
meshlets        = true
import_cameras  = false

[defaults.sound]
stream_above_seconds = 10   # longer sounds stream

# ---------- Assets ----------
[assets]
# Models: sub-assets become "env/castle#<node or mesh name>"
"env/castle"          = { type = "model",   source = "models/castle.glb" }
"env/castle_ruins"    = { type = "model",   source = "models/castle_ruins.fbx", scale = 0.01 }

# Textures
"env/stone_albedo"    = { type = "texture", source = "textures/stone_albedo.png" }
"env/stone_normal"    = { type = "texture", source = "textures/stone_normal.png", srgb = false, usage = "normal" }
"env/sky_hdri"        = { type = "texture", source = "textures/sky_4k.exr", usage = "environment" }

# Materials (TOML material files reference other asset IDs)
"env/stone"           = { type = "material", source = "materials/stone.mat.toml" }

# Shaders
"shaders/hologram"    = { type = "shader",  source = "shaders/hologram.slang" }

# 2D
"hero/sprites"        = { type = "aseprite", source = "sprites/hero.aseprite", pixel_art = true }
"level01/tiles"       = { type = "tilemap",  source = "maps/level01.ldtk" }

# Fonts and text
"ui/font"             = { type = "font",    source = "fonts/Inter.ttf", mode = "msdf", charset = "latin-ext" }
"ui/font_pixel"       = { type = "font",    source = "fonts/pixel.fnt", mode = "bitmap" }
"ui/strings"          = { type = "strings", source = "loc/strings.csv" }
"ui/theme"            = { type = "stylesheet", source = "ui/theme.toml" }

# Audio
"music/title"         = { type = "sound",   source = "audio/title.ogg", stream = true }
"sfx/click"           = { type = "sound",   source = "audio/click.wav" }

# Video
"video/intro"         = { type = "video",   source = "video/intro.webm" }

# Scenes and prefabs
"level01/scene"       = { type = "scene",   source = "scenes/level01.scene.toml" }

# Locale overrides: same asset ID, different source per locale
[assets."ui/logo"]
type   = "texture"
source = "textures/logo_en.png"
[assets."ui/logo".locale]
ja = "textures/logo_ja.png"
de = "textures/logo_de.png"

# ---------- Bundles ----------
[bundles.common]
assets   = ["ui/*", "sfx/click"]
resident = true             # never evicted

[bundles.title]
assets   = ["music/title", "video/intro"]
depends  = ["common"]

[bundles.level_01]
assets   = ["level01/*", "env/*", "hero/*", "shaders/hologram"]
depends  = ["common"]
priority = "high"

# Large-world streaming cells are bundles generated by the world tools:
# [bundles."world/cell_+003_-012"] ... loaded by distance from streaming sources.

# DENG-264: one source directory; cooker emits strings/main#en and #pt-BR.
[assets."strings/main"]
type = "string_table"
source = "strings/main"
default_locale = "en"
